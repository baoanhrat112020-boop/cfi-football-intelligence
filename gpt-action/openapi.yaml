openapi: 3.1.0

info:
  title: CFI Football Intelligence Production API
  version: 5.3.1-core-v4
  description: Strict-prior CFI API for supplied-fixture prediction, ranking, live analysis, immutable history and verified settlement.

servers:
  - url: https://cfi-football-intelligence.baoanhrat112020.workers.dev

paths:
  /api/status:
    get:
      operationId: cfiGetStatus
      summary: Get CFI runtime and Persistent DB health
      responses:
        "200":
          description: Runtime status
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true

  /api/discover:
    post:
      operationId: cfiDiscoverOpportunities
      summary: Rank supplied real prematch fixtures
      description: Rank only supplied fixture candidates. CFI canonicalizes, validates, runs strict-prior prediction and returns up to max_matches. It does not search for extra fixtures to fill a quota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - target_date
                - response_mode
                - fixture_candidates
              properties:
                target_date:
                  type: string
                  format: date
                timezone:
                  type: string
                  default: Asia/Ho_Chi_Minh
                start_time:
                  type: string
                  pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                end_time:
                  type: string
                  pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                max_matches:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
                response_mode:
                  type: string
                  enum: [compact, full]
                  default: compact
                market_filter:
                  type: string
                competition_filter:
                  type: string
                internal_provider_diagnostics:
                  type: boolean
                  default: false
                fixture_candidates:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - providerId
                      - home
                      - away
                      - kickoffIso
                      - status
                      - sourceUrls
                      - discoveredAt
                    properties:
                      provider:
                        type: string
                      providerId:
                        type: string
                        minLength: 1
                      home:
                        type: string
                        minLength: 1
                      away:
                        type: string
                        minLength: 1
                      competition:
                        type: string
                      country:
                        type: string
                      kickoffIso:
                        type: string
                        format: date-time
                      targetDate:
                        type: string
                        format: date
                      status:
                        type: string
                        enum: [scheduled, notstarted, pre]
                      sourceUrls:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          format: uri
                      discoveredAt:
                        type: string
                        format: date-time
                odds_by_fixture:
                  type: object
                  properties: {}
                  additionalProperties: true
      responses:
        "200":
          description: Ranked CFI opportunity board
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
        "400":
          description: Invalid fixture input
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
        "422":
          description: Identity or evidence rejected
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
        "500":
          description: Ranking runtime failure
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true

  /api/predict:
    post:
      operationId: cfiPredictMatch
      summary: Run strict-prior prematch prediction
      description: Predict one supplied HOME vs AWAY fixture. Use IMAGE_ANALYSIS when the fixture comes from prematch screenshots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - home
                - away
                - target_date
              properties:
                home:
                  type: string
                  minLength: 1
                away:
                  type: string
                  minLength: 1
                target_date:
                  type: string
                  format: date
                language:
                  type: string
                  enum: [vi, en, zh, th, id]
                  default: vi
                input_mode:
                  type: string
                  enum: [SINGLE_MATCH, IMAGE_ANALYSIS]
                  default: SINGLE_MATCH
                fixture_identity:
                  type: object
                  properties: {}
                  additionalProperties: true
                image_evidence:
                  type: object
                  properties: {}
                  additionalProperties: true
                odds:
                  type: object
                  properties: {}
                  additionalProperties: true
      responses:
        "200":
          description: CFI prediction
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
        "422":
          description: Evidence insufficient or input rejected
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
        "500":
          description: Prediction runtime failure
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true

  /api/predict-live:
    post:
      operationId: cfiPredictLive
      summary: Run CFI LIVE prediction
      description: Use only after positive evidence that play has started. Countdown, warm-up and lineups are prematch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - home
                - away
                - target_date
                - live
              properties:
                home:
                  type: string
                  minLength: 1
                away:
                  type: string
                  minLength: 1
                target_date:
                  type: string
                  format: date
                language:
                  type: string
                  enum: [vi, en, zh, th, id]
                  default: vi
                matchStatus:
                  type: string
                fixtureStatus:
                  type: string
                status:
                  type: string
                live:
                  type: object
                  properties: {}
                  additionalProperties: true
      responses:
        "200":
          description: CFI LIVE prediction
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
        "422":
          description: Invalid live state
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
