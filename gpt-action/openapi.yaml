openapi: 3.1.0
info:
  title: CFI Football Intelligence Production API
  version: 5.2.1
  description: Strict-prior Persistent DB prediction, prediction-history, result-collection and settlement API for the CFI Football Intelligence Custom GPT. Prediction responses expose a mandatory CFI_2_METHODS_X_6_TARGETS_V1 contract plus a canonical renderedReport.
servers:
  - url: https://cfi-football-intelligence.baoanhrat112020.workers.dev
paths:
  /api/status:
    get:
      operationId: cfiGetStatus
      summary: Get CFI runtime and Persistent DB health
      responses:
        "200":
          description: Runtime and database status without secrets
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
                  httpStatus: { type: integer }
                  ok: { type: boolean }
                  body: { type: object, additionalProperties: true }
                  runtime: { type: object, additionalProperties: true }
                additionalProperties: true
  /api/predict:
    post:
      operationId: cfiPredictMatch
      summary: Run a complete CFI pre-match prediction with Method A, Method B and FINAL for all six primary targets
      description: Always present the returned renderedReport as the canonical 2-methods-by-6-targets result. Do not collapse Top-3 HT or Top-3 FT into one unlabeled list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [home, away]
              properties:
                home: { type: string, minLength: 1 }
                away: { type: string, minLength: 1 }
                target_date: { type: string, format: date }
                language: { type: string, enum: [vi, en, zh, th, id], default: vi }
      responses:
        "200":
          description: Complete CFI 2 methods × 6 targets prediction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prediction" }
        "500":
          description: Runtime contract failure; never manufacture missing target outputs
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/prediction-history:
    get:
      operationId: cfiGetPredictionHistory
      summary: Get immutable user prediction history from Persistent DB
      description: Returns selected strict-prior prediction snapshots newest first. Use limit=5 for the five most recent predictions.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: target_date, in: query, required: false, schema: { type: string, format: date } }
        - { name: home, in: query, required: false, schema: { type: string } }
        - { name: away, in: query, required: false, schema: { type: string } }
        - { name: settlement_status, in: query, required: false, schema: { type: string, enum: [PENDING, SETTLED] } }
        - { name: selected_only, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Prediction history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryResponse" }
  /api/results:
    get:
      operationId: cfiGetResults
      summary: Get prediction versus actual settlement results
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: target_date, in: query, required: false, schema: { type: string, format: date } }
        - { name: home, in: query, required: false, schema: { type: string } }
        - { name: away, in: query, required: false, schema: { type: string } }
        - { name: settlement_status, in: query, required: false, schema: { type: string, enum: [PENDING, SETTLED] } }
        - { name: selected_only, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Prediction versus actual results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryResponse" }
  /api/collect-results:
    post:
      operationId: cfiCollectResults
      summary: Immediately collect actual results for unsettled user predictions and settle them
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                snapshot_id: { type: string, format: uuid }
                target_date: { type: string, format: date }
                home: { type: string }
                away: { type: string }
                settlement_status: { type: string, enum: [PENDING, SETTLED] }
                selected_only: { type: boolean, default: true }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Collector runtime summary plus current history rows
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    HistoryRow:
      type: object
      properties:
        snapshot_id: { type: string, format: uuid }
        target_date: { type: string, format: date }
        home_team: { type: string }
        away_team: { type: string }
        created_at: { type: string, format: date-time }
        engine_version: { type: string }
        prediction_status: { type: string }
        selected_for_match_audit: { type: boolean }
        verdict: { type: string }
        settlement_status: { type: string, enum: [PENDING, SETTLED] }
        settled_at: { type: [string, "null"], format: date-time }
        actual_ht_home: { type: [integer, "null"] }
        actual_ht_away: { type: [integer, "null"] }
        actual_ft_home: { type: [integer, "null"] }
        actual_ft_away: { type: [integer, "null"] }
        actual_markets: { type: [object, "null"], additionalProperties: true }
        market_brier: { type: [object, "null"], additionalProperties: true }
        top1_ht_hit: { type: [boolean, "null"] }
        top1_ft_hit: { type: [boolean, "null"] }
        top3_ht: { type: [array, "null"], items: { type: object, additionalProperties: true } }
        top3_ft: { type: [array, "null"], items: { type: object, additionalProperties: true } }
        most_likely_path: { type: [string, "null"] }
      additionalProperties: true
    HistoryResponse:
      type: object
      required: [status, action, count, rows]
      properties:
        status: { type: string }
        action: { type: string }
        count: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        rows: { type: array, items: { $ref: "#/components/schemas/HistoryRow" } }
      additionalProperties: true
    ScorelineCandidate:
      type: object
      required: [score, probability]
      properties:
        score: { type: string }
        probability: { type: number, minimum: 0, maximum: 1 }
      additionalProperties: false
    Top3MethodSet:
      type: object
      required: [methodA, methodB, final]
      properties:
        methodA:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/ScorelineCandidate" }
        methodB:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/ScorelineCandidate" }
        final:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/ScorelineCandidate" }
      additionalProperties: false
    ThresholdTarget:
      type: object
      required: [methodA, methodB, final]
      properties:
        methodA: { type: number, minimum: 0, maximum: 1 }
        methodB: { type: number, minimum: 0, maximum: 1 }
        final: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: [string, "null"] }
        hits: { type: [integer, "null"] }
        eligible: { type: [integer, "null"] }
      additionalProperties: false
    SixTargetMatrix:
      type: object
      required: [contract, primaryTargets, methods, threshold, scoreline, verification]
      properties:
        contract: { type: string, const: CFI_2_METHODS_X_6_TARGETS_V1 }
        primaryTargets:
          type: array
          minItems: 6
          maxItems: 6
          items: { type: string }
        methods:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: string }
        threshold:
          type: object
          required: ["3+ HT", "7+ FT", "Other HT", "Other FT"]
          properties:
            "3+ HT": { $ref: "#/components/schemas/ThresholdTarget" }
            "7+ FT": { $ref: "#/components/schemas/ThresholdTarget" }
            "Other HT": { $ref: "#/components/schemas/ThresholdTarget" }
            "Other FT": { $ref: "#/components/schemas/ThresholdTarget" }
          additionalProperties: false
        scoreline:
          type: object
          required: ["Top-3 HT", "Top-3 FT"]
          properties:
            "Top-3 HT": { $ref: "#/components/schemas/Top3MethodSet" }
            "Top-3 FT": { $ref: "#/components/schemas/Top3MethodSet" }
          additionalProperties: false
        verification:
          type: object
          required: [thresholdComplete, scorelineComplete, complete]
          properties:
            thresholdComplete: { type: boolean }
            scorelineComplete: { type: boolean }
            complete: { type: boolean, const: true }
          additionalProperties: false
      additionalProperties: false
    PresentationContract:
      type: object
      required: [mode, source, contract]
      properties:
        mode: { type: string, const: RENDER_RENDERED_REPORT_VERBATIM }
        source: { type: string, const: renderedReport }
        contract: { type: string, const: CFI_2_METHODS_X_6_TARGETS_V1 }
      additionalProperties: false
    Prediction:
      type: object
      required: [sixTargetMatrix, renderedReport, presentationContract]
      properties:
        status: { type: string }
        engine: { type: string }
        verdict: { type: string }
        target: { type: object, additionalProperties: true }
        evidence: { type: object, additionalProperties: true }
        teamTrendingDNA: { type: object, additionalProperties: true }
        markets: { type: object, additionalProperties: true }
        scoreline: { type: object, additionalProperties: true }
        ranking: { type: array, items: { type: object, additionalProperties: true } }
        sixTargetMatrix: { $ref: "#/components/schemas/SixTargetMatrix" }
        renderedReport:
          type: string
          description: Canonical preformatted 2-methods-by-6-targets report. The Custom GPT should present this report without collapsing or omitting A/B/FINAL Top-3 lists.
        presentationContract: { $ref: "#/components/schemas/PresentationContract" }
        runtime: { type: object, additionalProperties: true }
        audit: { type: object, additionalProperties: true }
      additionalProperties: true
