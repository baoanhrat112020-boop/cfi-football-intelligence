openapi: 3.1.0
info:
  title: CFI Football Intelligence Production API
  version: 5.0.1
  description: Strict-prior Persistent DB prediction API for the CFI Football Intelligence Custom GPT. Scoreline Intelligence is generated by the production engine with target-team goal ownership preserved across mixed HOME/AWAY history.
servers:
  - url: https://cfi-football-intelligence.baoanhrat112020.workers.dev
paths:
  /api/status:
    get:
      operationId: cfiGetStatus
      summary: Get CFI runtime and Persistent DB health
      responses:
        "200":
          description: Runtime and database status without secrets
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
                  httpStatus: { type: integer }
                  ok: { type: boolean }
                  body: { type: object, additionalProperties: true }
                  runtime: { type: object, additionalProperties: true }
                additionalProperties: true
  /api/predict:
    post:
      operationId: cfiPredictMatch
      summary: Run a complete CFI pre-match prediction
      description: Returns strict-prior canonical evidence, Team Trending DNA, Method A/B/Final probabilities for four frozen markets, HT/FT scorelines, context availability, ranking and localized verdict. Scoreline expected-goal series follow the target team by identity across mixed HOME/AWAY historical fixtures. Persistent DB fallback is used when an upstream prediction is not found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [home, away]
              properties:
                home:
                  type: string
                  minLength: 1
                  description: Exact HOME team name
                away:
                  type: string
                  minLength: 1
                  description: Exact AWAY team name
                target_date:
                  type: string
                  format: date
                  description: Target match date; only earlier fixtures are eligible evidence
                language:
                  type: string
                  enum: [vi, en, zh, th, id]
                  default: vi
      responses:
        "200":
          description: Complete CFI prediction or explicit insufficient-data result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          description: Invalid HOME/AWAY request
components:
  schemas:
    MarketResult:
      type: object
      required: [methodA, methodB, final, confidence, hits, eligible, smoothedRate, supportingFactors, opposingFactors]
      properties:
        methodA: { type: number, minimum: 0, maximum: 1 }
        methodB: { type: number, minimum: 0, maximum: 1 }
        final: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
        hits: { type: integer, minimum: 0 }
        eligible: { type: integer, minimum: 0 }
        rawRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        smoothedRate: { type: number, minimum: 0, maximum: 1 }
        supportingFactors: { type: array, items: { type: string } }
        opposingFactors: { type: array, items: { type: string } }
        calibration: { type: object, additionalProperties: true }
    ScorelineCandidate:
      type: object
      required: [score, probability]
      properties:
        score: { type: string }
        probability: { type: number, minimum: 0, maximum: 1 }
    Prediction:
      type: object
      required: [status, engine, language, target, evidence, teamTrendingDNA, context, markets, scoreline, ranking, verdict]
      properties:
        status: { type: string }
        engine: { type: string, description: Production engine version; Scoreline Intelligence requires CFI_FINAL_V5.0.1 or later for target-team ownership fix. }
        language: { type: string, enum: [vi, en, zh, th, id] }
        target: { type: object, additionalProperties: true }
        evidence:
          type: object
          required: [homeFixtures, awayFixtures, h2hFixtures, uniqueCanonical, htCoverage, ftCoverage, strictPrior]
          additionalProperties: true
        teamTrendingDNA: { type: object, additionalProperties: true }
        context: { type: object, additionalProperties: true }
        markets:
          type: object
          required: ["3+ HT", "7+ FT", "Other HT", "Other FT"]
          properties:
            "3+ HT": { $ref: "#/components/schemas/MarketResult" }
            "7+ FT": { $ref: "#/components/schemas/MarketResult" }
            "Other HT": { $ref: "#/components/schemas/MarketResult" }
            "Other FT": { $ref: "#/components/schemas/MarketResult" }
          additionalProperties: false
        scoreline:
          type: object
          description: Authoritative production scoreline output. Clients should present these values directly and must not reconstruct them from fixture-side score columns.
          required: [ht, ft, expectedGoals, mostLikelyPath, uncertainty, consistencyWarnings]
          properties:
            ht: { type: array, minItems: 3, maxItems: 3, items: { $ref: "#/components/schemas/ScorelineCandidate" } }
            ft: { type: array, minItems: 3, maxItems: 3, items: { $ref: "#/components/schemas/ScorelineCandidate" } }
            expectedGoals: { type: object, additionalProperties: { type: number } }
            mostLikelyPath: { type: string }
            uncertainty: { type: string }
            consistencyWarnings: { type: array, items: { type: string } }
        ranking:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: object, additionalProperties: true }
        verdict: { type: string, enum: [STRONG_SIGNAL, NO_STRONG_SIGNAL] }
        localized: { type: object, additionalProperties: true }
      additionalProperties: true
