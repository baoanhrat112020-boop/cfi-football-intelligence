openapi: 3.1.0
info:
  title: CFI Football Intelligence Production API
  version: 5.2.5-practical-output-v3
  description: Strict-prior CFI production API with Discovery-first opportunity scanning, single-match prediction, live prediction, immutable history and settlement.
servers:
  - url: https://cfi-football-intelligence.baoanhrat112020.workers.dev
paths:
  /api/status:
    get:
      operationId: cfiGetStatus
      summary: Get CFI runtime and Persistent DB health
      responses:
        "200":
          description: Runtime and database status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/discover:
    post:
      operationId: cfiDiscoverOpportunities
      summary: Discover and rank real pre-match CFI opportunities without requiring HOME/AWAY
      description: Use for requests such as "tìm trận tốt nhất hôm nay", "tìm 5 trận tốt nhất ngày ...", or a date/time-window scan. GPT first web-searches a broad real fixture pool and passes it as fixture_candidates with HTTPS provenance. The action canonicalizes those candidates against BigDB, runs the existing strict-prior CFI predictor, and returns the Daily Opportunity Board. Never ask the user for HOME/AWAY when the intent is discovery.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target_date: { type: string, format: date, description: Local target date. If omitted, production resolves the current local date for timezone. }
                start_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                end_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                timezone: { type: string, default: Asia/Ho_Chi_Minh }
                max_matches: { type: integer, minimum: 1, maximum: 10, default: 5 }
                market_filter: { type: string }
                competition_filter: { type: string }
                fixture_candidates:
                  type: array
                  maxItems: 100
                  description: Real scheduled fixtures found by GPT web search before the Action call. Search broadly across senior, women, youth, reserve and amateur competitions. Each candidate requires exact teams, kickoff, a stable provider ID, discovery timestamp and at least one HTTPS schedule source. Do not fabricate or infer missing fixtures.
                  items:
                    type: object
                    additionalProperties: false
                    required: [providerId, home, away, kickoffIso, status, sourceUrls, discoveredAt]
                    properties:
                      providerId: { type: string, minLength: 1 }
                      home: { type: string, minLength: 1 }
                      away: { type: string, minLength: 1 }
                      competition: { type: [string, "null"] }
                      country: { type: [string, "null"] }
                      kickoffIso: { type: string, format: date-time }
                      status: { type: string, enum: [scheduled, notstarted, pre] }
                      sourceUrls:
                        type: array
                        minItems: 1
                        items: { type: string, format: uri, pattern: "^https://" }
                      discoveredAt: { type: string, format: date-time }
                internal_provider_diagnostics:
                  type: boolean
                  default: false
                  description: Diagnostic-only legacy provider probe. GPT discovery must leave this false; production search belongs to the GPT orchestration layer.
                odds_by_fixture:
                  type: object
                  additionalProperties: true
                  description: Verified odds packages gathered after the first discovery call by exact-fixture web search, keyed by provider fixture ID or "Home vs Away". Capture available 1X2, main O/U and AH prices in values plus bookmaker/capturedAt/source/verified metadata, then rerun discovery. Missing prices remain unavailable.
      responses:
        "200":
          description: CFI Daily Opportunity Board from GPT-sourced real fixtures with strict-prior prediction evidence and always-visible 1X2/O-U/AH model summaries. Rerun with odds_by_fixture after web odds enrichment.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Invalid discovery input
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "500":
          description: Discovery fail-closed runtime failure
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/predict:
    post:
      operationId: cfiPredictMatch
      summary: Run complete CFI pre-match prediction for a specified HOME/AWAY fixture
      description: Use when the user names a specific match or supplies match/odds screenshots. The GPT extracts auditable fields from images and sends input_mode=IMAGE_ANALYSIS; raw image pixels are not prediction evidence. target_date is mandatory. Successful responses include Practical Output V3. SHADOW decisionUse must remain false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [home, away, target_date]
              properties:
                home: { type: string, minLength: 1 }
                away: { type: string, minLength: 1 }
                target_date: { type: string, format: date }
                language: { type: string, enum: [vi, en, zh, th, id], default: vi }
                input_mode:
                  type: string
                  enum: [IMAGE_ANALYSIS, SINGLE_MATCH]
                  default: SINGLE_MATCH
                fixture_identity:
                  type: object
                  additionalProperties: true
                  description: Canonical fixture verification result. Set verified=false when screenshot identity is ambiguous; Practical Output V3 then blocks decisions.
                image_evidence:
                  type: object
                  additionalProperties: true
                  description: Image count and extracted field names for provenance only. Screenshot history is not model evidence unless separately canonicalized and strict-prior stored.
                odds:
                  type: object
                  additionalProperties: true
                  description: Use {values, metadata}. metadata requires bookmaker, capturedAt, verified=true, source and optional maxAgeMinutes. Legacy unwrapped odds are never sufficient for BET in Output V3.
      responses:
        "200":
          description: Complete CFI prediction
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "422":
          description: Exact-team evidence insufficient
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "500":
          description: Runtime fail-closed error
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/predict-live:
    post:
      operationId: cfiPredictLive
      summary: Run CFI LIVE using the immutable strict-prior prematch prior plus current live state
      description: Use only after positive evidence that play has started. Countdown is not LIVE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [home, away, target_date, live]
              properties:
                home: { type: string, minLength: 1 }
                away: { type: string, minLength: 1 }
                target_date: { type: string, format: date }
                language: { type: string, enum: [vi, en, zh, th, id], default: vi }
                live:
                  type: object
                  additionalProperties: true
                  required: [minute, period, homeGoals, awayGoals]
                  properties:
                    minute: { type: number, minimum: 0, maximum: 130 }
                    period: { type: string, enum: [1H, HT, 2H] }
                    homeGoals: { type: integer, minimum: 0 }
                    awayGoals: { type: integer, minimum: 0 }
      responses:
        "200":
          description: CFI LIVE response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/prediction-history:
    get:
      operationId: cfiGetPredictionHistory
      summary: Get immutable prediction history
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: target_date, in: query, required: false, schema: { type: string, format: date } }
        - { name: home, in: query, required: false, schema: { type: string } }
        - { name: away, in: query, required: false, schema: { type: string } }
        - { name: settlement_status, in: query, required: false, schema: { type: string, enum: [PENDING, SETTLED] } }
        - { name: selected_only, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Prediction history rows
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/results:
    get:
      operationId: cfiGetResults
      summary: Get prediction-versus-actual settlement results
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: target_date, in: query, required: false, schema: { type: string, format: date } }
        - { name: home, in: query, required: false, schema: { type: string } }
        - { name: away, in: query, required: false, schema: { type: string } }
        - { name: settlement_status, in: query, required: false, schema: { type: string, enum: [PENDING, SETTLED] } }
        - { name: selected_only, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Settled/pending result rows
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/collect-results:
    post:
      operationId: cfiCollectResults
      summary: Collect verified results and settle immutable stored predictions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                snapshot_id: { type: string, format: uuid }
                target_date: { type: string, format: date }
                home: { type: string }
                away: { type: string }
                settlement_status: { type: string, enum: [PENDING, SETTLED] }
                selected_only: { type: boolean, default: true }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Collector summary and current history rows
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/bets:
    get:
      operationId: cfiGetBetHistory
      summary: Get user-confirmed bet records and verified settlements
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [RECORDED, SETTLED] } }
      responses:
        "200":
          description: Append-only user bet ledger
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      operationId: cfiRecordOrSettleBet
      summary: Record a user-confirmed bet or settle it after verified FT results
      description: This endpoint never places a wager. RECORD requires confirmed_by_user=true. SETTLE requires verified result scores, a result source URL, and result provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [action]
              properties:
                action: { type: string, enum: [RECORD, SETTLE] }
                confirmed_by_user: { type: boolean, const: true }
                target_date: { type: string, format: date }
                home: { type: string }
                away: { type: string }
                market_family: { type: string, enum: [CHAMPION, 1X2, OVER_UNDER, ASIAN_HANDICAP] }
                market: { type: string }
                period: { type: string, enum: [HT, FT] }
                selection: { type: string, enum: [HOME, DRAW, AWAY, OVER, UNDER, "3+ HT", "7+ FT", "OTHER HT", "OTHER FT"] }
                line: { type: number }
                odds: { type: number, exclusiveMinimum: 1 }
                stake: { type: number, exclusiveMinimum: 0 }
                bookmaker: { type: string }
                prediction_snapshot_id: { type: string, format: uuid }
                bet_id: { type: string, format: uuid }
                result_verified: { type: boolean, const: true }
                ht_home: { type: integer, minimum: 0 }
                ht_away: { type: integer, minimum: 0 }
                ft_home: { type: integer, minimum: 0 }
                ft_away: { type: integer, minimum: 0 }
                result_source_url: { type: string, format: uri }
                result_provenance: { type: object }
      responses:
        "200":
          description: Recorded or settled ledger result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401":
          description: Unauthorized ledger request
        "422":
          description: Missing explicit confirmation or verified result provenance
