openapi: 3.1.0
info:
  title: CFI Football Intelligence Production API
  version: 5.2.5-gpt-input-v3
  description: Strict-prior CFI production API for single-match prediction, supplied-fixture ranking, live prediction, immutable history and settlement. GPT is not required to autonomously crawl schedules or force five fixtures.
servers:
  - url: https://cfi-football-intelligence.baoanhrat112020.workers.dev
paths:
  /api/status:
    get:
      operationId: cfiGetStatus
      summary: Get CFI runtime and Persistent DB health
      responses:
        "200":
          description: Runtime and database status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/predict:
    post:
      operationId: cfiPredictMatch
      summary: Run complete CFI prematch prediction for one specified fixture
      description: Use when the user names a specific HOME/AWAY match or provides prematch screenshots. target_date is mandatory. Successful responses preserve the Champion 2 Methods x 6 Targets contract and additive Multi-Market output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [home, away, target_date]
              properties:
                home: { type: string, minLength: 1 }
                away: { type: string, minLength: 1 }
                target_date: { type: string, format: date }
                language: { type: string, enum: [vi, en, zh, th, id], default: vi }
                input_mode:
                  type: string
                  enum: [IMAGE_ANALYSIS, SINGLE_MATCH]
                  default: SINGLE_MATCH
                fixture_identity:
                  type: object
                  additionalProperties: true
                  description: Canonical fixture verification. Use verified=false when identity is ambiguous.
                image_evidence:
                  type: object
                  additionalProperties: true
                  description: Screenshot provenance only. Raw screenshots are not historical prediction evidence.
                odds:
                  type: object
                  additionalProperties: true
                  description: Optional {values, metadata}. Verified metadata should include bookmaker, capturedAt, source and verified=true.
      responses:
        "200":
          description: Complete CFI prediction
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "422":
          description: Exact-team evidence insufficient or fail-closed input rejection
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "500":
          description: Runtime fail-closed error
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/discover:
    post:
      operationId: cfiDiscoverOpportunities
      summary: Rank a supplied set of real prematch fixtures with CFI
      description: Use only when the user or an external verified source provides a fixture set. GPT must not autonomously crawl until it finds five matches. The action canonicalizes, deduplicates, performs strict-prior BigDB preflight, predicts usable candidates and returns a ranked board. The board may contain fewer rows than max_matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response_mode, fixture_candidates]
              properties:
                target_date:
                  type: string
                  format: date
                  description: Local target date for the supplied fixture set.
                start_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                end_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                timezone: { type: string, default: Asia/Ho_Chi_Minh }
                max_matches:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
                  description: Maximum rows to rank from the supplied set. This is never a requirement to find or fabricate that many fixtures.
                response_mode:
                  type: string
                  enum: [compact, full]
                  default: compact
                  description: Use compact for normal GPT ranking. Full is for technical audit only.
                market_filter: { type: string }
                competition_filter: { type: string }
                fixture_candidates:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Real scheduled fixtures supplied by the user, Local Node, screenshots/export, or an explicitly requested external search step. Never fabricate missing identity, kickoff, provider ID or provenance.
                  items:
                    type: object
                    additionalProperties: false
                    required: [providerId, home, away, kickoffIso, status, sourceUrls, discoveredAt]
                    properties:
                      providerId: { type: string, minLength: 1 }
                      home: { type: string, minLength: 1 }
                      away: { type: string, minLength: 1 }
                      competition: { type: [string, "null"] }
                      country: { type: [string, "null"] }
                      kickoffIso: { type: string, format: date-time }
                      status: { type: string, enum: [scheduled, notstarted, pre] }
                      sourceUrls:
                        type: array
                        minItems: 1
                        items: { type: string, format: uri, pattern: "^https://" }
                      discoveredAt: { type: string, format: date-time }
                internal_provider_diagnostics:
                  type: boolean
                  default: false
                  description: Diagnostic-only. Normal GPT use must keep this false to avoid duplicate provider crawling.
                odds_by_fixture:
                  type: object
                  additionalProperties: true
                  description: Optional verified odds packages keyed by provider ID or exact Home vs Away. Do not fabricate missing prices.
      responses:
        "200":
          description: Ranked CFI board for the supplied candidate set. Shortfall is allowed and must be reported truthfully.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Invalid candidate-set input
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "500":
          description: Discovery/ranking fail-closed runtime failure
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/predict-live:
    post:
      operationId: cfiPredictLive
      summary: Run CFI LIVE using strict-prior prematch evidence plus current live state
      description: Use only after positive evidence that play has started. Countdown is prematch, not LIVE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [home, away, target_date, live]
              properties:
                home: { type: string, minLength: 1 }
                away: { type: string, minLength: 1 }
                target_date: { type: string, format: date }
                language: { type: string, enum: [vi, en, zh, th, id], default: vi }
                live:
                  type: object
                  additionalProperties: true
                  required: [minute, period, homeGoals, awayGoals]
                  properties:
                    minute: { type: number, minimum: 0, maximum: 130 }
                    period: { type: string, enum: [1H, HT, 2H] }
                    homeGoals: { type: integer, minimum: 0 }
                    awayGoals: { type: integer, minimum: 0 }
      responses:
        "200":
          description: CFI LIVE response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/prediction-history:
    get:
      operationId: cfiGetPredictionHistory
      summary: Get immutable prediction history
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: target_date, in: query, required: false, schema: { type: string, format: date } }
        - { name: home, in: query, required: false, schema: { type: string } }
        - { name: away, in: query, required: false, schema: { type: string } }
        - { name: settlement_status, in: query, required: false, schema: { type: string, enum: [PENDING, SETTLED] } }
        - { name: selected_only, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Prediction history rows
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/results:
    get:
      operationId: cfiGetResults
      summary: Get prediction-versus-actual settlement results
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: target_date, in: query, required: false, schema: { type: string, format: date } }
        - { name: home, in: query, required: false, schema: { type: string } }
        - { name: away, in: query, required: false, schema: { type: string } }
        - { name: settlement_status, in: query, required: false, schema: { type: string, enum: [PENDING, SETTLED] } }
        - { name: selected_only, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Settled or pending result rows
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/collect-results:
    post:
      operationId: cfiCollectResults
      summary: Collect verified results and settle immutable stored predictions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                snapshot_id: { type: string, format: uuid }
                target_date: { type: string, format: date }
                home: { type: string }
                away: { type: string }
                settlement_status: { type: string, enum: [PENDING, SETTLED] }
                selected_only: { type: boolean, default: true }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Collector summary and current history rows
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/bets:
    get:
      operationId: cfiGetBetHistory
      summary: Get user-confirmed bet records and verified settlements
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [RECORDED, SETTLED] } }
      responses:
        "200":
          description: Append-only user bet ledger
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      operationId: cfiRecordOrSettleBet
      summary: Record a user-confirmed bet or settle it after verified FT results
      description: This endpoint never places a wager. RECORD requires explicit user confirmation. SETTLE requires verified result provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [action]
              properties:
                action: { type: string, enum: [RECORD, SETTLE] }
                confirmed_by_user: { type: boolean, const: true }
                target_date: { type: string, format: date }
                home: { type: string }
                away: { type: string }
                market_family: { type: string, enum: [CHAMPION, 1X2, OVER_UNDER, ASIAN_HANDICAP] }
                market: { type: string }
                period: { type: string, enum: [HT, FT] }
                selection: { type: string, enum: [HOME, DRAW, AWAY, OVER, UNDER, "3+ HT", "7+ FT", "OTHER HT", "OTHER FT"] }
                line: { type: number }
                odds: { type: number, exclusiveMinimum: 1 }
                stake: { type: number, exclusiveMinimum: 0 }
                bookmaker: { type: string }
                prediction_snapshot_id: { type: string, format: uuid }
                bet_id: { type: string, format: uuid }
                result_verified: { type: boolean, const: true }
                ht_home: { type: integer, minimum: 0 }
                ht_away: { type: integer, minimum: 0 }
                ft_home: { type: integer, minimum: 0 }
                ft_away: { type: integer, minimum: 0 }
                result_source_url: { type: string, format: uri }
                result_provenance: { type: object }
      responses:
        "200":
          description: Recorded or settled ledger result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { description: Unauthorized ledger request }
        "422": { description: Missing explicit confirmation or verified result provenance }
