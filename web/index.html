<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CFI Predict</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0e1a;
    color: #e8ecf5;
    min-height: 100vh;
    padding: 20px;
    padding-top: env(safe-area-inset-top, 20px);
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p {
    font-size: 13px;
    color: #6b7a99;
    margin-top: 4px;
  }
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input {
    flex: 1;
    background: #141a2e;
    border: 1px solid #1f2a44;
    border-radius: 10px;
    padding: 12px 14px;
    color: #e8ecf5;
    font-size: 14px;
    font-family: ui-monospace, monospace;
  }
  input:focus {
    outline: none;
    border-color: #4facfe;
  }
  button {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    color: #0a0e1a;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .market {
    background: #141a2e;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .market.high { border-color: #22c55e; }
  .market.medium { border-color: #eab308; }
  .market.low { border-color: #f97316; }
  .market.very_low { border-color: #ef4444; opacity: 0.7; }
  .market-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .market-label {
    font-size: 15px;
    font-weight: 600;
    color: #e8ecf5;
  }
  .badge {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .badge.high { background: #22c55e; color: #0a0e1a; }
  .badge.medium { background: #eab308; color: #0a0e1a; }
  .badge.low { background: #f97316; color: #0a0e1a; }
  .badge.very_low { background: #ef4444; color: white; }
  .prob {
    font-size: 32px;
    font-weight: 800;
    font-family: ui-monospace, monospace;
    letter-spacing: -1px;
    color: #4facfe;
  }
  .prob.high { color: #22c55e; }
  .prob.medium { color: #eab308; }
  .prob.low { color: #f97316; }
  .prob.very_low { color: #ef4444; }
  .market-bottom {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #6b7a99;
    margin-top: 4px;
  }
  .status {
    text-align: center;
    padding: 12px;
    font-size: 13px;
    color: #6b7a99;
  }
  .status.error { color: #ef4444; }
  .meta {
    background: #0f1424;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 12px;
    color: #8b98b3;
    font-family: ui-monospace, monospace;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
  }
  .meta-row span:last-child { color: #4facfe; }
</style>
</head>
<body>
  <div class="header">
    <h1>CFI Predict</h1>
    <p>Football Intelligence · v0.2.2 Beta 1 · Build 4</p>
  </div>

  <div class="input-group">
    <input id="fid" type="text" value="19a8b28a-9484-4c37-b705-6bff7b2636b3" placeholder="fixture_id (UUID)">
    <button id="btn" onclick="predict()">Predict</button>
  </div>

  <div id="status" class="status"></div>
  <div id="meta" class="meta" style="display:none"></div>
  <div id="results"></div>

<script>
const API = "https://kovmddkkzttquupdgmel.supabase.co/functions/v1/predict";
const KEY = "sb_publishable_IBiOB5Ef-6Y_BpdTu433_w_nsg7T9D2";

const LABELS = {
  "7ft": "7+ FT total",
  "oft": "1 đội 5+ FT",
  "3ht": "3+ HT total",
  "oht": "1 đội 4+ HT"
};

async function predict() {
  const fid = document.getElementById("fid").value.trim();
  if (!fid) return;
  
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const meta = document.getElementById("meta");
  
  btn.disabled = true;
  status.textContent = "Đang tính...";
  status.className = "status";
  results.innerHTML = "";
  meta.style.display = "none";
  
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ fixture_id: fid })
    });
    
    if (!r.ok) {
      const err = await r.json();
      throw new Error(err.error || "HTTP " + r.status);
    }
    
    const data = await r.json();
    status.textContent = "";
    
    meta.innerHTML = `
      <div class="meta-row"><span>fixture</span><span>${data.fixture_id.slice(0, 8)}...</span></div>
      <div class="meta-row"><span>date</span><span>${data.match_date}</span></div>
      <div class="meta-row"><span>version</span><span>${data.version}</span></div>
    `;
    meta.style.display = "block";
    
    const order = ["7ft", "oft", "3ht", "oht"];
    for (const mkt of order) {
      const p = data.predictions[mkt];
      if (!p) continue;
      const cls = (p.confidence || "LOW").toLowerCase();
      const pct = (p.p * 100).toFixed(2);
      
      results.innerHTML += `
        <div class="market ${cls}">
          <div class="market-top">
            <div class="market-label">${LABELS[mkt]}</div>
            <div class="badge ${cls}">${p.confidence}</div>
          </div>
          <div class="prob ${cls}">${pct}%</div>
          <div class="market-bottom">
            <span>${mkt}</span>
            <span>${p.features_used || "precomputed"}</span>
          </div>
        </div>
      `;
    }
  } catch (e) {
    status.textContent = "Lỗi: " + e.message;
    status.className = "status error";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
