name: CFI Livescore Ingest

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: Days back to crawl (1 = normal run, up to 60 for backfill)
        default: '1'

concurrency:
  group: livescore-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install curl_cffi supabase

      - name: LiveScore backfill
        env:
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
          LIVESCORE_DAYS_BACK: ${{ inputs.days_back || '1' }}
          LIVESCORE_SKIP_STAGING: ${{ (inputs.days_back && inputs.days_back != '1') && '1' || '0' }}
        run: python scripts/livescore_daily.py
