name: CFI Livescore Ingest

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: livescore-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install curl_cffi supabase

      - name: LiveScore backfill
        env:
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livescore_daily.py
