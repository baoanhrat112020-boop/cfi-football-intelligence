name: Deploy CFI-DB Function
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/cfi-db/**'
      - 'supabase/functions/_shared/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy cfi-db
        run: supabase functions deploy cfi-db --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
