name: Deploy CFI Worker

# TẠM DISABLE auto-deploy — bản CI 41abbe08 gây 1102, chưa tìm ra nguyên nhân.
# Bật lại sau khi fix: thêm smoke test /api/predict + verify bundle CI khớp local.
# Trigger push cũ: branches [main]; paths src/**, cloudflare-worker/**, worker/**,
# wrangler.toml, wrangler.jsonc, package.json, package-lock.json,
# tests/v14-alias-resolution-contract.test.mjs
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: cfi-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production deploys are gated by the full current contract suite.
      - run: npm test
      - name: Verify or configure BigDB production credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFI_DB_KEY: ${{ secrets.CFI_DB_KEY || secrets.CFI_ACTION_KEY }}
        run: |
          set -euo pipefail
          if npx wrangler secret list 2>/dev/null | grep -q 'CFI_DB_KEY'; then
            echo 'CFI_DB_KEY already exists in Cloudflare; preserving existing secret.'
          elif [ -n "$CFI_DB_KEY" ]; then
            printf '%s' "$CFI_DB_KEY" | npx wrangler secret put CFI_DB_KEY
          else
            echo 'CFI_DB_KEY is absent in Cloudflare and no GitHub source secret is configured.' >&2
            exit 42
          fi
      - name: Deploy production Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke daily fixture endpoint
        run: |
          node - <<'NODE'
          const date=new Intl.DateTimeFormat('en-CA',{
            timeZone:'Asia/Ho_Chi_Minh',
            year:'numeric',month:'2-digit',day:'2-digit'
          }).format(new Date());
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),12000);
          const started=Date.now();
          try{
            const response=await fetch('https://cfi-football-intelligence.baoanhrat112020.workers.dev/api/fixtures-day',{
              method:'POST',
              headers:{'content-type':'application/json','accept':'application/json'},
              body:JSON.stringify({target_date:date,timezone:'Asia/Ho_Chi_Minh'}),
              signal:controller.signal
            });
            const elapsed=Date.now()-started;
            const text=await response.text();
            if(!response.ok)throw new Error(`HTTP ${response.status}: ${text.slice(0,300)}`);
            let body;
            try{body=JSON.parse(text)}catch{throw new Error(`NON_JSON: ${text.slice(0,300)}`)}
            if(body?.status!=='OK'||body?.action!=='CFI_FIXTURES_DAY'||!Array.isArray(body?.rows)){
              throw new Error(`BAD_CONTRACT: ${text.slice(0,500)}`);
            }
            if(body?.version!=='CFI_FIXTURES_DAY_V11_NO_BONGDAWAP'){
              throw new Error(`WRONG_FIXTURE_VERSION: ${body?.version}`);
            }
            const bigDb=(body?.attempts||[]).find(x=>x?.provider==='CFI_BIGDB');
            if(!bigDb||bigDb.ok!==true||Number(bigDb.rows)<10){
              throw new Error(`BIGDB_PRIMARY_NOT_READY: ${JSON.stringify(bigDb)}`);
            }
            if(body.rows.length<20)throw new Error(`INSUFFICIENT_FIXTURES: ${body.rows.length}`);
            if(elapsed>12000)throw new Error(`FIXTURE_ENDPOINT_TOO_SLOW: ${elapsed}ms`);
            console.log(JSON.stringify({
              status:'PASS',
              elapsedMs:elapsed,
              fixtures:body.rows.length,
              source:body.source,
              bigDbRows:bigDb.rows,
              providers:body.providers
            }));
          }finally{
            clearTimeout(timer);
          }
          NODE
