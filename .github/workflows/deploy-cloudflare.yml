name: Deploy CFI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cloudflare-worker/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/v14-alias-resolution-contract.test.mjs'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: cfi-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production deploys are gated by the full current contract suite.
      - run: npm test
      - name: Verify or configure BigDB production credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFI_DB_KEY: ${{ secrets.CFI_DB_KEY || secrets.CFI_ACTION_KEY }}
        run: |
          set -euo pipefail
          if npx wrangler secret list 2>/dev/null | grep -q 'CFI_DB_KEY'; then
            echo 'CFI_DB_KEY already exists in Cloudflare; preserving existing secret.'
          elif [ -n "$CFI_DB_KEY" ]; then
            printf '%s' "$CFI_DB_KEY" | npx wrangler secret put CFI_DB_KEY
          else
            echo 'CFI_DB_KEY is absent in Cloudflare and no GitHub source secret is configured.' >&2
            exit 42
          fi
      - name: Deploy production Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
