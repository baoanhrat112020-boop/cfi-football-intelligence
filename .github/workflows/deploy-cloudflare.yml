name: Deploy CFI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cloudflare-worker/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/v14-alias-resolution-contract.test.mjs'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: cfi-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure BigDB production credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFI_DB_KEY: ${{ secrets.CFI_DB_KEY || secrets.CFI_ACTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$CFI_DB_KEY"
          printf '%s' "$CFI_DB_KEY" | npx wrangler secret put CFI_DB_KEY
      - name: Deploy production Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
