name: Bongdawap Odds Sync
on:
  schedule:
    - cron: '23 1,3,7,11,15,19,23 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bongdawap_odds.py
        env:
          SB_URL: https://zbwkowqluwuvsnajkuvc.supabase.co
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
