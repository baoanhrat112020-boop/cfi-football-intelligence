name: Tmp Eval Blend

on:
  push:
    branches: [tmp/eval-blend]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate
        env:
          K: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 .github/eval_blend.py
