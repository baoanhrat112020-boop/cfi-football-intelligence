name: tmp suggest probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          B=https://cfi-football-intelligence.baoanhrat112020.workers.dev
          for p in "/api/suggest" "/api/suggest?minutes=30" "/api/suggest?minutes=240" "/api/status"; do
            out=$(curl -sS -m 25 -D /tmp/h.txt -o /tmp/b.txt -w '%{http_code}' "$B$p" 2>&1 || true)
            body=$(head -c 400 /tmp/b.txt 2>/dev/null | tr '\n' ' ' | tr -d '"')
            ray=$(grep -i '^cf-ray' /tmp/h.txt 2>/dev/null | tr -d '\r' || true)
            echo "::notice title=probe $p::status=$out $ray body=$body"
          done
