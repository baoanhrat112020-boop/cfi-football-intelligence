name: GoldMe Top Eval

on:
  workflow_dispatch:
    inputs:
      lookback:
        default: '60'
      min_n:
        default: '5'
  push:
    branches: [feat/goldme-top-eval]
    paths: ['scripts/goldme_top_eval.py', 'scripts/goldme_top_eval.py', '.github/workflows/goldme-top-eval.yml']

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase pandas
      - name: Evaluate
        env:
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
          LOOKBACK: ${{ inputs.lookback || '60' }}
          MIN_N: ${{ inputs.min_n || '5' }}
        run: python scripts/goldme_top_eval.py
