name: Fill Odds Gaps (OddsPortal)

on:
  schedule:
    - cron: '53 3,7,11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scrape and parse but do not write to the database
        type: boolean
        default: true
      hours:
        description: Kickoff window in hours
        default: '12'

permissions:
  contents: read

concurrency:
  group: fill-odds-gaps
  cancel-in-progress: false

env:
  SB_URL: https://zbwkowqluwuvsnajkuvc.supabase.co
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
  HOURS: ${{ inputs.hours || '12' }}
  PROXY_URL: socks5://127.0.0.1:40000

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OddsHarvester and Chromium
        run: |
          pip install oddsharvester
          playwright install --with-deps chromium
      - name: Start Cloudflare WARP proxy
        shell: bash
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          echo "warp egress ip: $(curl -sS -m 15 -x socks5h://127.0.0.1:40000 https://api.ipify.org || echo failed)"
      - name: Plan targets
        id: plan
        shell: bash
        env:
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/fill_odds_gaps.py plan --hours "$HOURS" --out targets.json --workdir work | tee plan.log
          grep -E '^plan ' plan.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Harvester log tail
        if: always()
        shell: bash
        run: tail -40 work/links.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-odds-plan
          path: |
            targets.json
            work/
          retention-days: 3
          if-no-files-found: warn

  scrape:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OddsHarvester and Chromium
        run: |
          pip install oddsharvester
          playwright install --with-deps chromium
      - name: Start Cloudflare WARP proxy
        shell: bash
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          echo "warp egress ip: $(curl -sS -m 15 -x socks5h://127.0.0.1:40000 https://api.ipify.org || echo failed)"
      - uses: actions/download-artifact@v4
        with:
          name: fill-odds-plan
          path: plan
      - name: Scrape full_time
        shell: bash
        env:
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EXTRA=""
          if [ "$DRY_RUN" = "true" ]; then EXTRA="--dry-run"; fi
          python scripts/fill_odds_gaps.py scrape --period full_time --targets plan/targets.json --budget-min 85 --workdir work $EXTRA | tee scrape.log
          echo "### full_time (dry_run=$DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(result|ok) ' scrape.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Harvester log tail
        if: always()
        shell: bash
        run: tail -60 work/scrape_full_time.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-odds-scrape-full_time
          path: |
            scrape.log
            work/
          retention-days: 3
          if-no-files-found: warn
