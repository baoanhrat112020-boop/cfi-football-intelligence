name: CFI Supabase Control Plane Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/cfi-supabase-control-plane-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_REF: kovmddkkzttquupdgmel
      MGMT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Inspect platform readonly and disk state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MGMT_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN missing'; exit 1; }
          H=(-H "Authorization: Bearer $MGMT_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${H[@]}" "https://api.supabase.com/v1/projects/$PROJECT_REF/readonly" -o /tmp/readonly-before.json
          curl -fsS "${H[@]}" "https://api.supabase.com/v1/projects/$PROJECT_REF/config/disk" -o /tmp/disk.json
          curl -fsS "${H[@]}" "https://api.supabase.com/v1/projects/$PROJECT_REF/config/disk/util" -o /tmp/disk-util.json
          curl -fsS "${H[@]}" "https://api.supabase.com/v1/projects/$PROJECT_REF/config/disk/autoscale" -o /tmp/disk-autoscale.json
          echo "READONLY_BEFORE=$(jq -c '{enabled,override_enabled,override_active_until}' /tmp/readonly-before.json)"
          echo "DISK=$(jq -c '{attributes,last_modified_at}' /tmp/disk.json)"
          echo "DISK_UTIL=$(jq -c . /tmp/disk-util.json)"
          echo "DISK_AUTOSCALE=$(jq -c . /tmp/disk-autoscale.json)"

      - name: Open temporary write window only when readonly is enabled
        shell: bash
        run: |
          set -euo pipefail
          H=(-H "Authorization: Bearer $MGMT_TOKEN" -H 'Content-Type: application/json')
          ENABLED=$(jq -r '.enabled // false' /tmp/readonly-before.json)
          if [ "$ENABLED" = 'true' ]; then
            CODE=$(curl -sS -o /tmp/readonly-disable.json -w '%{http_code}' -X POST "${H[@]}" "https://api.supabase.com/v1/projects/$PROJECT_REF/readonly/temporary-disable")
            test "$CODE" = '201' || { echo "temporary-disable failed HTTP=$CODE"; cat /tmp/readonly-disable.json; exit 1; }
          fi
          sleep 5
          curl -fsS "${H[@]}" "https://api.supabase.com/v1/projects/$PROJECT_REF/readonly" -o /tmp/readonly-after.json
          echo "READONLY_AFTER=$(jq -c '{enabled,override_enabled,override_active_until}' /tmp/readonly-after.json)"
          jq -e '.enabled==false or .override_enabled==true' /tmp/readonly-after.json >/dev/null

      - name: Trigger existing backfill once and verify P1 P3 recovery
        shell: bash
        run: |
          set -euo pipefail
          H=(-H "Authorization: Bearer $MGMT_TOKEN" -H 'Content-Type: application/json')
          KEYS=$(curl -fsS "${H[@]}" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
          ANON=$(printf '%s' "$KEYS" | jq -r '[.[] | select((.name=="anon") or (.type=="publishable")) | .api_key][0] // empty')
          test -n "$ANON" || { echo 'No publishable/anon key returned'; exit 1; }
          echo "::add-mask::$ANON"
          CODE=$(curl -sS -o /tmp/backfill.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ANON" -H "apikey: $ANON" -H 'Content-Type: application/json' \
            -d '{}' "https://$PROJECT_REF.supabase.co/functions/v1/cfi-historical-backfill")
          echo "BACKFILL_HTTP=$CODE"
          test "$CODE" = '200' || { jq -c '{error,message,status}' /tmp/backfill.json 2>/dev/null || true; exit 1; }
          jq -c '{status,source,expansion,researchResume,settlementEval}' /tmp/backfill.json

          SQL="select current_setting('default_transaction_read_only') as default_read_only, (select count(*) from public.cfi_backfill_sources where division_code in ('EC','SC1','SC2','SC3')) as expansion_sources, (select count(*) from public.cfi_backfill_sources where division_code in ('EC','SC1','SC2','SC3') and status='COMPLETED') as expansion_completed, (select jsonb_build_object('run_id',run_id,'status',status,'processed_count',processed_count,'next_offset',next_offset,'chunk_size',chunk_size,'updated_at',updated_at,'error',error) from public.cfi_mm_historical_v2_runs order by created_at desc limit 1) as p1;"
          BODY=$(jq -n --arg query "$SQL" '{query:$query,read_only:true}')
          curl -fsS "${H[@]}" -d "$BODY" "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -o /tmp/recovery-status.json
          echo "RECOVERY_STATUS=$(jq -c . /tmp/recovery-status.json)"
