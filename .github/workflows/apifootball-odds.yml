name: API-Football Odds

on:
  schedule:
    - cron: '35 17 * * *'
    - cron: '35 23 * * *'
    - cron: '35 5 * * *'
    - cron: '35 11 * * *'
  workflow_dispatch:
    inputs:
      write:
        description: 'Ghi vao match_odds (true/false)'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: apifootball-odds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          SB_URL: https://zbwkowqluwuvsnajkuvc.supabase.co
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
          WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.write }}
        run: |
          if [ "$WRITE" = "true" ]; then python scripts/apifootball_odds.py --write; else python scripts/apifootball_odds.py; fi
