name: Production Fixture Smoke

on:
  push:
    branches: [ops/production-fixture-smoke-20260915]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Smoke production fixtures-day
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          URL="https://cfi-football-intelligence.baoanhrat112020.workers.dev/api/fixtures-day"
          start="$(date +%s%3N)"
          body="$(curl --fail-with-body --silent --show-error --max-time 12             -H 'content-type: application/json'             -H 'accept: application/json'             --data "{\"target_date\":\"$DATE\",\"timezone\":\"Asia/Ho_Chi_Minh\"}"             "$URL")"
          end="$(date +%s%3N)"
          elapsed="$((end-start))"
          node -e '
            const body=JSON.parse(process.argv[1]);
            const big=(body.attempts||[]).find(x=>x.provider==="CFI_BIGDB");
            const out={
              status:body.status,
              version:body.version,
              fixtures:Array.isArray(body.rows)?body.rows.length:null,
              source:body.source,
              providers:body.providers,
              bigDbRows:big?.rows??null,
              attempts:(body.attempts||[]).map(x=>({provider:x.provider,ok:x.ok,httpStatus:x.httpStatus,rows:x.rows,error:x.error})),
              sample:Array.isArray(body.rows)?body.rows.slice(0,8).map(x=>[x.kickoffLocal,x.home,x.away,x.provider]):[]
            };
            console.log(JSON.stringify(out));
            if(body.status!=="OK"||body.action!=="CFI_FIXTURES_DAY"||!Array.isArray(body.rows)) process.exit(2);
            if(body.version!=="CFI_FIXTURES_DAY_V5_PARALLEL_ALL_DAY") process.exit(3);
            if(body.rows.length<20) process.exit(4);
            if(!big||big.ok!==true||Number(big.rows)<10) process.exit(5);
          ' "$body"
          echo "elapsed_ms=$elapsed"
          test "$elapsed" -lt 12000
