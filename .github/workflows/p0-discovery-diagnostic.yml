name: P0 Discovery Diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Worker deploy convergence
        run: sleep 45
      - name: Probe production
        shell: bash
        run: |
          set +e
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          echo '--- STATUS ---'
          curl -sS --max-time 30 -w '\nHTTP=%{http_code}\n' "$BASE/api/status"
          echo '--- DISCOVERY ---'
          curl -sS --max-time 120 -H 'content-type: application/json' -d "{\"target_date\":\"$TARGET_DATE\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"max_matches\":2,\"scan_limit\":12}" -w '\nHTTP=%{http_code}\n' "$BASE/api/discover"
      - name: Verify V1.4 lightweight discovery contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          curl -fsS --max-time 120 -H 'content-type: application/json' \
            -d "{\"target_date\":\"$TARGET_DATE\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"max_matches\":2,\"scan_limit\":12,\"internal_provider_diagnostics\":false}" \
            "$BASE/api/discover" -o /tmp/v14-production.json
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/v14-production.json','utf8'));
          const fail=(m)=>{throw new Error(m)};
          if(x.status!=='OK'||x.action!=='CFI_DISCOVERY'||x.version!=='CFI_AUTO_DISCOVERY_V1.4')fail('V1.4 discovery contract failed');
          if(x.search?.mode!=='GPT_SEARCH_FIRST'||x.search?.internalProviderDiagnostics!==false)fail('GPT search-first mode missing');
          if((x.providerAttempts||[]).length!==0)fail('default path unexpectedly called provider crawler');
          if(x.rules?.strictPriorRequired!==true||x.rules?.gptSearchFirstRequired!==true||x.rules?.internalProviderCrawlerDefault!==false||x.rules?.shadowDecisionUse!==false)fail('V1.4 safety rules changed');
          console.log(JSON.stringify({status:x.status,version:x.version,targetDate:x.targetDate,provider:x.provider,search:x.search,counts:x.counts,final:x.final},null,2));
          NODE
