name: CFI iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/cfi-ios-shell
    paths:
      - "ios/**"
      - "web/**"
      - ".github/workflows/build-ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: xcodebuild -list -project ios/CFI.xcodeproj

      - name: Build CFI.app without signing
        run: |
          set -euo pipefail
          xcodebuild             -project ios/CFI.xcodeproj             -scheme CFI             -configuration Release             -sdk iphoneos             -derivedDataPath "$RUNNER_TEMP/cfi-ios-derived"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Inject CFI app icon
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/cfi-ios-derived/Build/Products/Release-iphoneos/CFI.app"
          ICON_SRC="$RUNNER_TEMP/cfi-icon.jpg"
          base64 -D -i ios/Resources/cfi-icon.jpg.b64 -o "$ICON_SRC"
          sips -z 60 60 "$ICON_SRC" --out "$APP/AppIcon60x60.png" >/dev/null
          sips -z 120 120 "$ICON_SRC" --out "$APP/AppIcon60x60@2x.png" >/dev/null
          sips -z 180 180 "$ICON_SRC" --out "$APP/AppIcon60x60@3x.png" >/dev/null
          sips -z 1024 1024 "$ICON_SRC" --out "$APP/iTunesArtwork.png" >/dev/null
          python3 - <<'PY'
          import os, plistlib
          app=os.environ["RUNNER_TEMP"]+"/cfi-ios-derived/Build/Products/Release-iphoneos/CFI.app"
          path=app+"/Info.plist"
          with open(path,"rb") as fh:
              p=plistlib.load(fh)
          p["CFBundleIcons"]={
              "CFBundlePrimaryIcon":{
                  "CFBundleIconFiles":["AppIcon60x60","AppIcon60x60@2x","AppIcon60x60@3x"],
                  "UIPrerenderedIcon":False
              }
          }
          with open(path,"wb") as fh:
              plistlib.dump(p,fh,sort_keys=False)
          PY
          test -s "$APP/AppIcon60x60@3x.png"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          bash ios/scripts/package-unsigned-ipa.sh             "$RUNNER_TEMP/cfi-ios-derived/Build/Products/Release-iphoneos/CFI.app"             "$RUNNER_TEMP/CFI-iOS-unsigned.ipa"

      - name: Inspect IPA
        run: |
          set -euo pipefail
          unzip -l "$RUNNER_TEMP/CFI-iOS-unsigned.ipa"
          test -s "$RUNNER_TEMP/CFI-iOS-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CFI-iOS-unsigned
          path: ${{ runner.temp }}/CFI-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
