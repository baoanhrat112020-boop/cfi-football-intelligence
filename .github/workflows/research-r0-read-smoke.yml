name: CFI Research R0 Read Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r0-read-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CFI_SUPABASE_URL: https://kovmddkkzttquupdgmel.supabase.co
      CFI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify pinned production baseline
        shell: bash
        run: |
          set -euo pipefail
          node research/production-baseline-lock.mjs
      - name: Verify privileged research credential is wired
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CFI_SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'CFI_SUPABASE_SERVICE_ROLE_KEY secret is missing'; exit 2; }
      - name: Export strict-prior R0 corpus read-only
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r0-corpus.json"
          node research/export-r0-corpus.mjs "$OUT" > "$RUNNER_TEMP/r0-summary.json"
          node --input-type=module - "$OUT" <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.manifestVersion!=='CFI_TIME_MACHINE_V2') throw new Error(`UNEXPECTED_MANIFEST:${x.manifestVersion}`);
          if(x.privilegedResearchRead!==true) throw new Error('PRIVILEGED_RESEARCH_READ_NOT_PROVEN');
          if(!Number.isInteger(x.fixtureCount)||x.fixtureCount<=0) throw new Error('EMPTY_R0_CORPUS');
          if(!Array.isArray(x.fixtures)||x.fixtures.length!==x.fixtureCount) throw new Error('R0_COUNT_MISMATCH');
          if(x.fixtures.some(r=>String(r.match_date)>='2026-08-20')) throw new Error('R0_HOLDOUT_LEAKAGE');
          console.log(JSON.stringify({
            status:'PASS',
            baseline:'CFI_FINAL_V5.3.0 + CFI_PRIMARY_TOP1_RUNTIME_V2 + CFI_MULTI_MARKET_V1',
            baselineCommitSha:'518dfb57aafc8428e09b3ec84e440146c839a19e',
            primaryContract:'CFI_2_METHODS_X_6_TARGETS_V2',
            historicalEvaluator:'CFI_MULTI_MARKET_HISTORICAL_LEARNING_V2.1',
            manifestVersion:x.manifestVersion,
            fixtureCount:x.fixtureCount,
            sourceFixtureCount:x.sourceFixtureCount,
            droppedUnresolvedTeamCount:x.droppedUnresolvedTeamCount,
            privilegedResearchRead:x.privilegedResearchRead,
            prospectiveHoldoutPreserved:true,
            decisionUse:false,
            productionMutation:false
          },null,2));
          NODE
      - name: Remove corpus artifact
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/r0-corpus.json" "$RUNNER_TEMP/r0-summary.json"
