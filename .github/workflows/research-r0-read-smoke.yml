name: CFI Research R0 Read Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r0-read-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CFI_SUPABASE_URL: https://kovmddkkzttquupdgmel.supabase.co
      CFI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify pinned production baseline
        run: node research/production-baseline-lock.mjs
      - name: Verify privileged research credential is wired
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CFI_SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'CFI_SUPABASE_SERVICE_ROLE_KEY secret is missing'; exit 2; }
      - name: Export strict-prior R0 + Group A features read-only
        shell: bash
        run: |
          set -euo pipefail
          R0="$RUNNER_TEMP/r0-corpus.json"
          GA="$RUNNER_TEMP/group-a-features.json"
          node research/export-r0-corpus.mjs "$R0" > "$RUNNER_TEMP/r0-summary.json"
          node research/export-group-a-features.mjs "$GA" > "$RUNNER_TEMP/group-a-summary.json"
          node --input-type=module - "$R0" "$GA" <<'NODE'
          import fs from 'node:fs';
          const r0=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ga=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if(r0.manifestVersion!=='CFI_TIME_MACHINE_V2') throw new Error(`UNEXPECTED_MANIFEST:${r0.manifestVersion}`);
          if(r0.privilegedResearchRead!==true||ga.privilegedResearchRead!==true) throw new Error('PRIVILEGED_RESEARCH_READ_NOT_PROVEN');
          if(!Number.isInteger(r0.fixtureCount)||r0.fixtureCount<=0) throw new Error('EMPTY_R0_CORPUS');
          if(!Array.isArray(r0.fixtures)||r0.fixtures.length!==r0.fixtureCount) throw new Error('R0_COUNT_MISMATCH');
          if(r0.fixtures.some(r=>String(r.match_date)>='2026-08-20')) throw new Error('R0_HOLDOUT_LEAKAGE');
          if(ga.strictPrior!==true||ga.strengths.some(r=>r.strict_prior!==true)) throw new Error('GROUP_A_STRICT_PRIOR_NOT_PROVEN');
          if(ga.strengths.some(r=>String(r.as_of_date)>='2026-08-20')) throw new Error('GROUP_A_HOLDOUT_LEAKAGE');
          if(ga.baselineCommitSha!=='518dfb57aafc8428e09b3ec84e440146c839a19e') throw new Error('GROUP_A_BASELINE_LINEAGE_DRIFT');
          console.log(JSON.stringify({
            status:'PASS',
            baseline:'CFI_FINAL_V5.3.0 + CFI_PRIMARY_TOP1_RUNTIME_V2 + CFI_MULTI_MARKET_V1',
            baselineCommitSha:ga.baselineCommitSha,
            primaryContract:'CFI_2_METHODS_X_6_TARGETS_V2',
            historicalEvaluator:'CFI_MULTI_MARKET_HISTORICAL_LEARNING_V2.1',
            fixtureCount:r0.fixtureCount,
            metadataCoverage:r0.metadataCoverage,
            strengthRowCount:ga.strengthRowCount,
            competitionCount:ga.competitionCount,
            segmentCount:ga.segmentCount,
            strictPrior:true,
            privilegedResearchRead:true,
            prospectiveHoldoutPreserved:true,
            decisionUse:false,
            productionMutation:false
          },null,2));
          NODE
      - name: Remove research artifacts
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/r0-corpus.json" "$RUNNER_TEMP/group-a-features.json" "$RUNNER_TEMP/r0-summary.json" "$RUNNER_TEMP/group-a-summary.json"
