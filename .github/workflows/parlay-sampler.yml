name: CFI Parlay Sampler

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parlay-sampler
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sample prob and edge parlays
        env:
          W: https://cfi-football-intelligence.baoanhrat112020.workers.dev
        run: |
          for q in "mode=suggest&odds=0" "mode=suggest&odds=0&rank=edge"; do
            curl -sS --max-time 60 --retry 2 --retry-delay 5 -o out.json -w "%{http_code} " "$W/api/suggest-parlays?$q"
            node -e "const j=require('./out.json');console.log('$q','rank='+j.rank,'cards='+(j.parlays||[]).length)"
          done
