name: Check two odds sources

on:
  push:
    branches: [test/gha-oddsharvester]
    paths: ['.github/workflows/check-two-sources.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump suggest payload sample
        env:
          SB_URL: https://zbwkowqluwuvsnajkuvc.supabase.co
          KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ["SB_URL"]
          key = os.environ["KEY"]
          h = {"apikey": key, "Authorization": "Bearer " + key, "Content-Type": "application/json"}
          req = urllib.request.Request(base + "/rest/v1/rpc/cfi_suggest_upcoming", data=json.dumps({"p_minutes": 2880}).encode(), headers=h, method="POST")
          d = json.load(urllib.request.urlopen(req, timeout=60))
          picked, seen = [], set()
          for s in d.get("slots", []):
              for m in s.get("matches", []):
                  sig = (bool(m.get("no_stats")), bool(m.get("market_odds")), m.get("confidence_tier") or m.get("tier"))
                  if sig not in seen and len(picked) < 4:
                      seen.add(sig)
                      picked.append((s, m))
          out = {"top_keys": sorted(d.keys()), "slot_keys": sorted(d["slots"][0].keys()) if d.get("slots") else [], "slot_count": len(d.get("slots", []))}
          print("META " + json.dumps(out))
          for s, m in picked:
              print("SAMPLE " + json.dumps({"date": s.get("date"), "hour": s.get("hour"), "match": m}, ensure_ascii=False, separators=(",", ":")))
          PY
