name: CFI HF Shadow Node

on:
  pull_request:
    paths:
      - 'cfi-hf-shadow-node/**'
      - 'tests/hf-shadow-node.test.mjs'
      - 'src/prediction/multi-market-backtest.ts'
      - '.github/workflows/hf-shadow.yml'
  workflow_dispatch:

concurrency:
  group: cfi-hf-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: HF shadow unit and E2E smoke tests
        run: node --experimental-strip-types --test tests/hf-shadow-node.test.mjs
      - name: HF shadow direct smoke
        run: node --experimental-strip-types cfi-hf-shadow-node/src/smoke.mjs
      - name: HF shadow short soak
        run: node --experimental-strip-types cfi-hf-shadow-node/src/soak.mjs
      - name: Build Docker Space image
        run: docker build -f cfi-hf-shadow-node/Dockerfile -t cfi-hf-shadow-node:v1 .
      - name: Boot, run real immutable API job, restart, and verify artifact persistence
        run: |
          set -euo pipefail
          VOLUME=cfi-hf-shadow-artifacts
          CONTAINER=cfi-hf-shadow
          RUN_ID=HF-DOCKER-E2E-RESTART-01
          CORPUS_SHA="$(sha256sum cfi-hf-shadow-node/testdata/real-cfi-smoke-corpus.json | awk '{print $1}')"
          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker volume rm "$VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$VOLUME" >/dev/null

          boot() {
            docker run -d --rm --name "$CONTAINER" -p 7860:7860 \
              -e CFI_CODE_COMMIT_SHA="$GITHUB_SHA" \
              -v "$VOLUME":/home/node/artifacts \
              cfi-hf-shadow-node:v1 >/dev/null
            rm -f /tmp/hf-health.json
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:7860/health > /tmp/hf-health.json; then break; fi
              sleep 1
            done
            cat /tmp/hf-health.json
            grep -q '"shadow_only":true' /tmp/hf-health.json
            grep -q '"production_mutation":false' /tmp/hf-health.json
            grep -q '"production_write_capability":false' /tmp/hf-health.json
            grep -q "\"code_commit_sha\":\"$GITHUB_SHA\"" /tmp/hf-health.json
          }

          boot
          cat > /tmp/hf-job.json <<JSON
          {"kind":"historical","run_id":"$RUN_ID","dataset":{"location":"/home/node/app/cfi-hf-shadow-node/testdata/real-cfi-smoke-corpus.json","sha256":"$CORPUS_SHA","version":"CFI_HF_REAL_SMOKE_ENGLAND_E2_2016_V1"}}
          JSON
          curl -fsS -X POST http://127.0.0.1:7860/v1/jobs \
            -H 'content-type: application/json' --data-binary @/tmp/hf-job.json > /tmp/hf-job-result.json
          cat /tmp/hf-job-result.json
          grep -q '"status":"PASS"' /tmp/hf-job-result.json
          grep -q '"production_mutation":false' /tmp/hf-job-result.json
          curl -fsS "http://127.0.0.1:7860/v1/runs/$RUN_ID/manifest" > /tmp/hf-manifest-before.json
          grep -q "\"run_id\":\"$RUN_ID\"" /tmp/hf-manifest-before.json
          docker stop "$CONTAINER" >/dev/null

          boot
          curl -fsS "http://127.0.0.1:7860/v1/runs/$RUN_ID/manifest" > /tmp/hf-manifest-after.json
          cat /tmp/hf-manifest-after.json
          grep -q "\"run_id\":\"$RUN_ID\"" /tmp/hf-manifest-after.json
          grep -q '"production_mutation":false' /tmp/hf-manifest-after.json
          cmp /tmp/hf-manifest-before.json /tmp/hf-manifest-after.json
          docker logs "$CONTAINER"
          docker stop "$CONTAINER" >/dev/null
      - name: Attempt isolated Hugging Face deployment when credential exists
        env:
          HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_LEGACY: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
          HF_SPACE_ID_CONFIG: ${{ vars.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          TOKEN="${HF_TOKEN_PRIMARY:-${HF_TOKEN_LEGACY:-}}"
          if [[ -z "$TOKEN" ]]; then
            echo 'DEPLOYMENT_BLOCKED_NO_HF_CREDENTIAL'
            exit 0
          fi
          export HF_TOKEN="$TOKEN"
          python -m pip install --disable-pip-version-check -q -U huggingface_hub
          if [[ -n "${HF_SPACE_ID_CONFIG:-}" ]]; then
            export HF_SPACE_ID="$HF_SPACE_ID_CONFIG"
          else
            unset HF_SPACE_ID || true
          fi
          DEPLOY_OUTPUT="$(./cfi-hf-shadow-node/deploy-hf.sh)"
          echo "$DEPLOY_OUTPUT"
          SPACE_ID="$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/^DEPLOYED_SPACE=//p' | tail -1)"
          [[ -n "$SPACE_ID" ]] || { echo 'HF_DEPLOY_SPACE_ID_MISSING'; exit 4; }
          hf spaces wait "$SPACE_ID" --timeout 10m
          python - "$SPACE_ID" <<'PY'
          import json, os, sys, time, urllib.request
          from huggingface_hub import HfApi

          space_id = sys.argv[1]
          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)
          runtime = api.get_space_runtime(space_id)
          if str(runtime.stage) != 'RUNNING':
              raise SystemExit(f'HF_SPACE_NOT_RUNNING:{runtime.stage}')
          info = api.space_info(space_id)
          host = getattr(info, 'host', None)
          if not host:
              subdomain = getattr(info, 'subdomain', None)
              if not subdomain:
                  raise SystemExit('HF_SPACE_HOST_UNRESOLVED')
              host = f'https://{subdomain}.hf.space'
          if not host.startswith('http'):
              host = f'https://{host}'
          url = host.rstrip('/') + '/health'
          last = None
          for _ in range(30):
              try:
                  request = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode('utf-8')
                  payload = json.loads(body)
                  if payload.get('status') == 'PASS' and payload.get('shadow_only') is True and payload.get('production_mutation') is False and payload.get('production_write_capability') is False:
                      print(json.dumps({'HF_LIVE_HEALTH': payload, 'space_id': space_id}, separators=(',', ':')))
                      break
                  last = f'INVALID_HEALTH:{body}'
              except Exception as exc:
                  last = repr(exc)
              time.sleep(2)
          else:
              raise SystemExit(f'HF_LIVE_HEALTH_FAILED:{last}')
          PY
