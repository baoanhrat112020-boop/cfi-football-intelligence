name: CFI Independent AI Auditor V1

on:
  workflow_run:
    workflows: ["CFI Tests"]
    types: [completed]

concurrency:
  group: cfi-independent-ai-auditor-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  independent-ai-review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted auditor from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download deterministic audit from upstream CFI Tests run
        uses: actions/download-artifact@v4
        with:
          name: cfi-deterministic-audit-${{ github.event.workflow_run.id }}
          path: audit-reports/deterministic
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run read-only independent AI review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFI_AI_AUDIT_MODEL: "@cf/zai-org/glm-4.7-flash"
        run: >-
          node tools/cfi-independent-ai-auditor.mjs
          --repo "${{ github.repository }}"
          --pr "${{ github.event.workflow_run.pull_requests[0].number }}"
          --head-sha "${{ github.event.workflow_run.head_sha }}"
          --output-dir audit-reports/independent-ai

      - name: Publish independent AI audit summary
        if: always()
        run: |
          if [ -f audit-reports/independent-ai/latest.md ]; then
            cat audit-reports/independent-ai/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload independent AI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfi-independent-ai-audit-${{ github.event.workflow_run.id }}
          path: audit-reports/independent-ai/
          if-no-files-found: warn
