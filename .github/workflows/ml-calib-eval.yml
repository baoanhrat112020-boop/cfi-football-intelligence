name: CFI ML Calibration Eval

on:
  workflow_dispatch:
  push:
    branches: [feat/ml-calib-eval]
    paths: ['scripts/ml_calib_eval.py', 'scripts/ml_odds_probe.py', '.github/workflows/ml-calib-eval.yml']

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase pandas numpy scipy scikit-learn
      - name: Evaluate
        env:
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ml_odds_probe.py
