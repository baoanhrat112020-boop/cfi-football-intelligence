name: CFI Final Production E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '47 0 * * *'

concurrency:
  group: cfi-final-production-e2e
  cancel-in-progress: true

jobs:
  practical-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run the single truthful 5-match production acceptance
        env:
          CFI_DISCOVERY_URL: https://cfi-football-intelligence.gpt-openai.workers.dev/api/discover
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Ho_Chi_Minh date +%F)
          BODY=$(mktemp)
          HTTP=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --max-time 120 \
            -o "$BODY" -w '%{http_code}' \
            -X POST "$CFI_DISCOVERY_URL" \
            -H 'content-type: application/json' \
            --data "{\"target_date\":\"$TODAY\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"max_matches\":5,\"response_mode\":\"compact\"}")
          test "$HTTP" = "200"
          node - "$BODY" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const a = body.audit || {};
          const requested = 5;
          const n = (x) => Number(x || 0);
          const board = Array.isArray(body.board) ? body.board : [];
          const counters = {
            fixturesDiscovered: n(a.fixturesDiscovered),
            canonicalized: n(a.canonicalized),
            predictionAttempts: n(a.predictionAttempts),
            predictionSuccess: n(a.predictionSuccess),
            fullPredictionsExecuted: n(a.fullPredictionsExecuted),
            boardRows: board.length,
          };
          const failures = [];
          for (const [key, value] of Object.entries(counters)) {
            if (value < requested) failures.push(`VERIFIED_SHORTFALL_${key.toUpperCase()}_${value}_OF_${requested}`);
          }
          const rejected = Array.isArray(a.rejectedFixtures) ? a.rejectedFixtures : [];
          const requiredReasonFields = ['match','predictionStatus','strictPrior','failureLayer','reasonCode'];
          for (const row of rejected) {
            for (const field of requiredReasonFields) {
              if (!(field in row)) failures.push(`REJECTED_FIXTURE_MISSING_${field.toUpperCase()}`);
            }
          }
          if (counters.fixturesDiscovered > counters.predictionSuccess && rejected.length === 0) {
            failures.push('MISSING_PER_FIXTURE_FAILURE_REASONS');
          }
          const strictPriorFailures = board.filter(row => row?.strictPrior === false || row?.audit?.strictPrior === false);
          if (strictPriorFailures.length) failures.push('STRICT_PRIOR_FAILURE');
          if (body.multiMarket?.decisionUse !== false && a.multiMarketDecisionUse !== false) {
            failures.push('MULTI_MARKET_SHADOW_SAFETY_FAIL');
          }
          console.log(JSON.stringify({requested, ...counters, rejectedCount: rejected.length, failures}, null, 2));
          if (failures.length) process.exit(1);
          NODE
