name: CFI Final Production E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfi-final-production-e2e.yml'
  workflow_run:
    workflows: ['Deploy CFI Worker']
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: cfi-final-production-e2e
  cancel-in-progress: true

jobs:
  practical-acceptance:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for deployed edge convergence
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 30
      - name: Run the single truthful production acceptance
        env:
          CFI_DISCOVERY_URL: https://cfi-football-intelligence.baoanhrat112020.workers.dev/api/discover
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Ho_Chi_Minh date +%F)
          DISCOVERED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$(mktemp)
          PAYLOAD=$(node - "$TODAY" "$DISCOVERED_AT" <<'NODE'
          const [today, discoveredAt] = process.argv.slice(2);
          const dateSource = `https://foosports.com/fixtures/${today}/`;
          const verified = today === '2026-08-28' ? [
            ['Prospect United','Hurstville FC','Australia New South Wales NPL 2','Australia','2026-08-28T10:00:00Z','https://www.falconscores.com/fixtures/prospect-united-vs-hurstville-fc-mjkcozrb'],
            ['Incheon Red Angels W','Gyeongju W','WK-League','South Korea','2026-08-28T10:00:00Z','https://www.falconscores.com/fixtures/incheon-red-angels-w-vs-gyeongju-w-nrqhi4fi'],
            ['Suwon FMC W','Seoul W','WK-League','South Korea','2026-08-28T10:00:00Z','https://www.falconscores.com/fixtures/suwon-fmc-w-vs-seoul-w-yno6ixlw'],
            ['Ansan Greeners','Daegu FC','K League 2','South Korea','2026-08-28T10:30:00Z','https://www.falconscores.com/fixtures/ansan-greeners-vs-daegu-fc-znqvgewu'],
            ['Jeonnam Dragons','Cheonan City','K League 2','South Korea','2026-08-28T10:30:00Z','https://www.falconscores.com/fixtures/jeonnam-dragons-vs-cheonan-city-2tvp6jaf'],
            ['Dynamo Makhachkala U19','Rostov U19','Youth Championship','Russia','2026-08-28T11:00:00Z','https://www.falconscores.com/fixtures/dynamo-makhachkala-u19-vs-rostov-u19-ibtxoy2t'],
            ['Dinamo Moskva U19','Akademiya Konoplev U20','Youth Championship','Russia','2026-08-28T11:00:00Z','https://www.falconscores.com/fixtures/dinamo-moskva-u19-vs-akademiya-konoplev-u20-j7whi4gu'],
            ['Lokomotiv Moskva U19','Chertanovo U20','Youth Championship','Russia','2026-08-28T11:00:00Z','https://www.falconscores.com/fixtures/lokomotiv-moskva-u19-vs-chertanovo-u20-cjxqdlez'],
            ['Dalian Zhixing','Beijing Guoan','China Super League','China','2026-08-28T11:35:00Z','https://www.falconscores.com/fixtures/dalian-zhixing-vs-beijing-guoan-arlnhjgx'],
            ['Sichuan Jiuniu','SHANGHAI SIPG','China Super League','China','2026-08-28T12:00:00Z','https://www.falconscores.com/fixtures/sichuan-jiuniu-vs-shanghai-sipg-ptllyfty'],
          ] : [];
          const fixture_candidates = verified.map(([home,away,competition,country,kickoffIso,providerId]) => ({
            provider:'GPT_WEB_SEARCH', providerId, home, away, competition, country, kickoffIso,
            targetDate:today, status:'scheduled', sourceUrls:[providerId,dateSource], discoveredAt
          }));
          process.stdout.write(JSON.stringify({target_date:today,timezone:'Asia/Ho_Chi_Minh',max_matches:5,response_mode:'compact',internal_provider_diagnostics:true,fixture_candidates}));
          NODE
          )
          echo "webSearchCandidates=$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.fixture_candidates.length)' "$PAYLOAD")"
          HTTP=$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 180 -o "$BODY" -w '%{http_code}' -X POST "$CFI_DISCOVERY_URL" -H 'content-type: application/json' --data "$PAYLOAD")
          echo "HTTP=$HTTP"
          if [ "$HTTP" != "200" ]; then cat "$BODY"; exit 1; fi
          node - "$BODY" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const a = {...(body.counts || {}), ...(body.audit || {})};
          const requested = 5;
          const n = (x) => Number(x || 0);
          const board = Array.isArray(body.board) ? body.board : [];
          const rejected = Array.isArray(a.rejectedFixtures) ? a.rejectedFixtures : Array.isArray(body.diagnostics) ? body.diagnostics.filter(row => row?.reasonCode) : [];
          const counters = {fixturesDiscovered:n(a.fixturesDiscovered),canonicalized:n(a.canonicalized),predictionAttempts:n(a.predictionAttempts),predictionSuccess:n(a.predictionSuccess),fullPredictionsExecuted:n(a.fullPredictionsExecuted),boardRows:board.length};
          const failures = [];
          for (const [key, value] of Object.entries(counters)) if (value < requested) failures.push(`VERIFIED_SHORTFALL_${key.toUpperCase()}_${value}_OF_${requested}`);
          const requiredReasonFields = ['match','predictionStatus','strictPrior','failureLayer','reasonCode'];
          for (const row of rejected) for (const field of requiredReasonFields) if (!(field in row)) failures.push(`REJECTED_FIXTURE_MISSING_${field.toUpperCase()}`);
          if (counters.fixturesDiscovered > counters.predictionSuccess && rejected.length === 0) failures.push('MISSING_PER_FIXTURE_FAILURE_REASONS');
          const strictPriorFailures = board.filter(row => row?.strictPrior === false || row?.audit?.strictPrior === false);
          if (strictPriorFailures.length) failures.push('STRICT_PRIOR_FAILURE');
          if (body.multiMarket?.decisionUse !== false && a.multiMarketDecisionUse !== false && body.rules?.shadowDecisionUse !== false) failures.push('MULTI_MARKET_SHADOW_SAFETY_FAIL');
          const evidence={requested,...counters,rejectedCount:rejected.length,rejectedFixtures:rejected,providerAttempts:body.providerAttempts||a.providerAttempts||[],search:body.search||a.search||null,board:board.map(row=>({match:row.match,kickoffLocal:row.kickoffLocal,status:row.status,strictPrior:row.strictPrior,consistency:row.consistency,multiMarketStatus:row.multiMarketStatus,multiMarketDecisionUse:row.multiMarketDecisionUse})),failures};
          console.log(JSON.stringify(evidence, null, 2));
          if (failures.length) process.exit(1);
          NODE
