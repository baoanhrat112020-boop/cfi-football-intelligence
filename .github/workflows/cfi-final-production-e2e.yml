name: CFI Final Production E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfi-final-production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  final-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Worker deploy convergence
        run: sleep 45

      - name: Run V1.4 GPT-search-first production discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          CAPTURED_AT=$(date -u +%FT%TZ)
          export TARGET_DATE CAPTURED_AT
          node - <<'NODE'
          const fs=require('fs');
          const target=process.env.TARGET_DATE;
          const capturedAt=process.env.CAPTURED_AT;
          const payload={
            target_date:target,
            timezone:'Asia/Ho_Chi_Minh',
            max_matches:5,
            scan_limit:40,
            internal_provider_diagnostics:false,
            fixture_candidates:[
              {providerId:'gpt-web-qizilqum-nasaf-20260826',home:'Qizilqum Zarafshon',away:'Nasaf Qarshi',competition:'Uzbekistan Super League',country:'Uzbekistan',kickoffIso:'2026-08-26T15:00:00Z',status:'SCHEDULED',sourceUrls:['https://www.sofascore.com/football/team/pfk-qizilqum/40265'],discoveredAt:capturedAt},
              {providerId:'gpt-web-nomme-rummu-20260826',home:'Nomme Kalju III',away:'Rummu Dunamo',competition:'Estonia II Liiga',country:'Estonia',kickoffIso:'2026-08-26T16:00:00Z',status:'SCHEDULED',sourceUrls:['https://www.sofascore.com/football/match/nomme-kalju-iii-rummu-dunamo/uNEshqFb'],discoveredAt:capturedAt},
              {providerId:'gpt-web-wolfsburg-inter-w-20260826',home:'VfL Wolfsburg Women',away:'Inter Milan Women',competition:"UEFA Women's Champions League",country:'Europe',kickoffIso:'2026-08-26T16:00:00Z',status:'SCHEDULED',sourceUrls:['https://www.uefa.com/womenschampionsleague/fixtures-results/'],discoveredAt:capturedAt},
              {providerId:'gpt-web-sparta-servette-w-20260826',home:'Sparta Prague Women',away:'Servette Genf Women',competition:"UEFA Women's Champions League",country:'Europe',kickoffIso:'2026-08-26T16:30:00Z',status:'SCHEDULED',sourceUrls:['https://www.uefa.com/womenschampionsleague/fixtures-results/'],discoveredAt:capturedAt},
              {providerId:'gpt-web-rapid-hearts-20260826',home:'SK Rapid Wien',away:'Hearts',competition:'UEFA Conference League Qualifying',country:'Europe',kickoffIso:'2026-08-26T16:45:00Z',status:'SCHEDULED',sourceUrls:['https://www.sofascore.com/football/match/heart-of-midlothian-sk-rapid-wien/fQsdX'],discoveredAt:capturedAt}
            ]
          };
          fs.writeFileSync('/tmp/final-request.json',JSON.stringify(payload));
          NODE
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/final-request.json','utf8')); if(x.target_date!==process.env.TARGET_DATE) process.exit(1)"
          HTTP_CODE=$(curl -sS --max-time 120 -H 'content-type: application/json' \
            --data-binary @/tmp/final-request.json "$BASE/api/discover" \
            -o /tmp/final-production.json -w '%{http_code}' || true)
          echo "Production discovery HTTP=$HTTP_CODE"
          if [ "$HTTP_CODE" != '200' ]; then
            cat /tmp/final-production.json
            exit 1
          fi

      - name: Verify final production contract
        env:
          EXPECTED_VERSION: CFI_AUTO_DISCOVERY_V1.4
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/final-production.json','utf8'));
          const c=x?.counts||{};
          const fail=(m)=>{throw new Error(m)};
          if(x.status!=='OK'||x.action!=='CFI_DISCOVERY'||x.version!==process.env.EXPECTED_VERSION)fail(`discovery contract failed: expected ${process.env.EXPECTED_VERSION}, got ${x.version}`);
          if(x.search?.mode!=='GPT_SEARCH_FIRST')fail('GPT search-first telemetry missing');
          if(x.search?.aiCandidatesReceived!==5||x.search?.aiCandidatesAccepted!==5||c.aiDiscoveredFixtures<5)fail('five real GPT candidates did not enter production');
          if(x.search?.internalProviderDiagnostics!==false||(x.providerAttempts||[]).length!==0)fail('default path called internal provider crawler');
          if(c.predictionAttempts<5||c.fullPredictionsExecuted<5)fail('five production prediction attempts were not executed');
          if(!Array.isArray(x.board))fail('production board missing');
          if(x.rules?.strictPriorRequired!==true||x.rules?.shadowDecisionUse!==false||x.rules?.gptSearchFirstRequired!==true||x.rules?.internalProviderCrawlerDefault!==false)fail('V1.4 safety contract changed');
          for(const row of x.board){
            const p=row.prediction, v=p?.outputV3, s=p?.sixTargetMatrix;
            if(row.strictPrior!==true)fail(`${row.match}: strict-prior missing`);
            if(!row.snapshotId && !p?.audit?.body?.snapshotId)fail(`${row.match}: immutable snapshot missing`);
            if(s?.verification?.complete!==true||s?.primaryTargets?.length!==6)fail(`${row.match}: Champion 6 incomplete`);
            if(!v?.marketSummary?.oneXTwo||!v?.marketSummary?.overUnder||!v?.marketSummary?.asianHandicap)fail(`${row.match}: market summary incomplete`);
            if(!v?.explosionScenario||!v?.evidenceSufficiency||!v?.betLedger)fail(`${row.match}: practical output blocks missing`);
            if(v.betLedger.autoPlaced===true||v.betLedger.explicitConfirmationRequired!==true)fail(`${row.match}: ledger safety contract failed`);
          }
          fs.writeFileSync('/tmp/final-summary.json',JSON.stringify({
            status:x.status,version:x.version,targetDate:x.targetDate,provider:x.provider,search:x.search,counts:c,final:x.final,
            board:x.board.map(r=>({match:r.match,kickoffLocal:r.kickoffLocal,status:r.status,strictPrior:r.strictPrior,snapshotId:r.prediction?.audit?.body?.snapshotId??null,champion:r.prediction?.sixTargetMatrix,marketSummary:r.prediction?.outputV3?.marketSummary,explosionScenario:r.prediction?.outputV3?.explosionScenario,evidenceSufficiency:r.prediction?.outputV3?.evidenceSufficiency,betLedger:r.prediction?.outputV3?.betLedger}))
          },null,2));
          console.log(fs.readFileSync('/tmp/final-summary.json','utf8'));
          NODE

      - name: Publish final production evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          if [ ! -f /tmp/final-summary.json ]; then
            echo '::warning::Final production summary was not produced.'
            exit 0
          fi
          {
            echo '## CFI Final Production E2E'
            echo
            echo '```json'
            cat /tmp/final-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          TITLE='[AUTO] CFI Final Production E2E'
          BODY=$(cat /tmp/final-summary.json)
          REPORT=$(printf 'Run: %s\nCommit: %s\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$BODY")
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title=="[AUTO] CFI Final Production E2E") | .number' 2>/dev/null | head -n1 || true)
          if [ -n "${ISSUE:-}" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$REPORT" || echo "::warning::Could not publish final evidence to issue #$ISSUE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$REPORT" || echo '::warning::Could not create final evidence issue'
          fi
