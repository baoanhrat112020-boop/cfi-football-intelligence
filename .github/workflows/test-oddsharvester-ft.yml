name: Test OddsHarvester FT only

on:
  push:
    branches: [test/gha-oddsharvester]
    paths: ['.github/workflows/test-oddsharvester-ft.yml']

permissions:
  contents: read

concurrency:
  group: test-oddsharvester-ft
  cancel-in-progress: true

jobs:
  ft_clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OddsHarvester and Chromium
        shell: bash
        run: |
          set -eo pipefail
          pip install oddsharvester
          pip show oddsharvester | sed -n 1,3p
          playwright install --with-deps chromium
          mkdir -p out

      - name: Probe league page
        shell: bash
        run: |
          set -eo pipefail
          echo "replica=${{ matrix.replica }} runner ip: $(curl -sS -m 10 https://api.ipify.org || echo unknown)" | tee out/ip.txt
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          code=$(curl -sS -m 25 -A "$UA" -o /dev/null -w '%{http_code}' https://www.oddsportal.com/football/spain/laliga2/ || echo curl_failed)
          echo "probe_get=$code" | tee out/probe.txt

      - name: Scrape FT only (period full_time, today UTC)
        shell: bash
        run: |
          set -eo pipefail
          rc=0
          D=$(date -u +%Y%m%d)
          echo "date_arg=$D"
          start=$(date +%s)
          timeout 1500 oddsharvester upcoming -s football -l spain-laliga2 \
            -d "$D" --period full_time \
            -m 1x2,asian_handicap,over_under \
            --headless -f json -o out/ft.json > out/ft.stdout.log 2> out/ft.stderr.log || rc=$?
          echo "ft_exit=$rc elapsed=$(( $(date +%s) - start ))s" | tee out/ft.exit.txt
          echo "=== stdout head 30 ==="; head -30 out/ft.stdout.log
          echo "=== stderr tail 30 ===";  tail -30 out/ft.stderr.log
          ls -la out/
          exit 0

      - name: Upload logs and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddsharvester-ft-logs-${{ matrix.replica }}
          path: out/
          retention-days: 3
          if-no-files-found: warn

      - name: RESULT summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, re
          def read(p):
              try:
                  return open(p, encoding="utf-8", errors="replace").read()
              except Exception:
                  return ""
          out, err = read("out/ft.stdout.log"), read("out/ft.stderr.log")
          both = out + "\n" + err
          print("## RESULT (FT only, clean job, replica ${{ matrix.replica }})")
          print("ip:", read("out/ip.txt").strip(), "|", read("out/probe.txt").strip())
          print("exit:", read("out/ft.exit.txt").strip() or "n/a")
          m = re.findall(r"Found (\d+) event rows", both)
          print("event rows found on league page:", m[-1] if m else "n/a")
          m = re.findall(r"Successfully scraped (\d+) matches \((\d+) failed", both)
          print("scraped/failed:", m[-1] if m else "no summary line")
          m2 = re.findall(r"Scraping completed: (.*)", both)
          print("scraper summary:", m2[-1] if m2 else "n/a")
          rl = re.findall(r"rate limited by OddsPortal: HTTP 429 on (\d+) request", both)
          print("rate-limited matches:", len(rl), "| 429 requests (sum):", sum(int(x) for x in rl))
          print("ERR_HTTP_RESPONSE_CODE_FAILURE lines:", both.count("ERR_HTTP_RESPONSE_CODE_FAILURE"))
          n = 0
          path = "out/ft.json"
          if not os.path.exists(path):
              print("no ft.json output")
          else:
              try:
                  data = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  print("invalid json:", e)
                  data = []
              rows = data if isinstance(data, list) else [data]
              n = len(rows)
              print("matches in json:", n)
              periods, books, ou, ah, x12 = set(), set(), 0, 0, 0
              for r in rows:
                  if not isinstance(r, dict):
                      continue
                  for k, v in r.items():
                      if k.endswith("_market") and isinstance(v, list) and v:
                          if k.startswith("over_under"): ou += 1
                          if k.startswith("asian_handicap"): ah += 1
                          if k.startswith("1x2"): x12 += 1
                          for e in v:
                              if isinstance(e, dict):
                                  periods.add(e.get("period"))
                                  books.add(e.get("bookmaker_name"))
              print("distinct period values:", sorted(map(str, periods)))
              print("non-empty markets: OU", ou, "| AH", ah, "| 1x2", x12)
              print("bookmakers:", sorted(map(str, books))[:12])
              for r in rows[:8]:
                  if isinstance(r, dict):
                      print("  -", r.get("match_date"), r.get("home_team"), "-", r.get("away_team"))
          if n < 5:
              print("\nLast 30 stderr lines (matches < 5):")
              print("\n".join(err.splitlines()[-30:]))
          PY
