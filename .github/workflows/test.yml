name: CFI Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cfi-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Zero-AI deterministic CFI gate
        run: node tools/cfi-audit.mjs --full --no-cache
      - name: Upload deterministic audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfi-deterministic-audit-${{ github.run_id }}
          path: audit-reports/
          if-no-files-found: ignore
