name: CFI Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cfi-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/cfi-worker-dry-run
      - name: Verify pinned production baseline before DB smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/research-read-adapter'
        run: node research/production-baseline-lock.mjs
      - name: DB-backed R0 + Group A read smoke (read-only)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/research-read-adapter'
        env:
          CFI_SUPABASE_URL: https://kovmddkkzttquupdgmel.supabase.co
          CFI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CFI_SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'CFI_SUPABASE_SERVICE_ROLE_KEY secret is missing'; exit 2; }
          R0="$RUNNER_TEMP/r0-corpus.json"
          GA="$RUNNER_TEMP/group-a-features.json"
          node research/export-r0-corpus.mjs "$R0" > "$RUNNER_TEMP/r0-summary.json"
          node research/export-group-a-features.mjs "$GA" > "$RUNNER_TEMP/group-a-summary.json"
          node --input-type=module - "$R0" "$GA" <<'NODE'
          import fs from 'node:fs';
          const r0=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ga=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if(r0.manifestVersion!=='CFI_TIME_MACHINE_V2') throw new Error(`UNEXPECTED_MANIFEST:${r0.manifestVersion}`);
          if(r0.privilegedResearchRead!==true||ga.privilegedResearchRead!==true) throw new Error('PRIVILEGED_RESEARCH_READ_NOT_PROVEN');
          if(!Number.isInteger(r0.fixtureCount)||r0.fixtureCount<=0) throw new Error('EMPTY_R0_CORPUS');
          if(r0.fixtures.some(r=>String(r.match_date)>='2026-08-20')) throw new Error('R0_HOLDOUT_LEAKAGE');
          if(ga.strictPrior!==true||ga.strengths.some(r=>r.strict_prior!==true)) throw new Error('GROUP_A_STRICT_PRIOR_NOT_PROVEN');
          if(ga.strengths.some(r=>String(r.as_of_date)>='2026-08-20')) throw new Error('GROUP_A_HOLDOUT_LEAKAGE');
          if(ga.baselineCommitSha!==r0.fixtures && false) throw new Error('UNREACHABLE');
          console.log(JSON.stringify({status:'PASS',fixtureCount:r0.fixtureCount,metadataCoverage:r0.metadataCoverage,strengthRowCount:ga.strengthRowCount,competitionCount:ga.competitionCount,segmentCount:ga.segmentCount,strictPrior:true,privilegedResearchRead:true,prospectiveHoldoutPreserved:true,decisionUse:false,productionMutation:false},null,2));
          NODE
          rm -f "$R0" "$GA" "$RUNNER_TEMP/r0-summary.json" "$RUNNER_TEMP/group-a-summary.json"
