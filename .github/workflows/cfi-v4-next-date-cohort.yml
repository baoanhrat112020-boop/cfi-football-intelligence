name: CFI V4 Next-Date Cohort Smoke

on:
  push:
    branches: ['test/v4-next-date-cohort']
    paths:
      - '.github/workflows/cfi-v4-next-date-cohort.yml'

jobs:
  next-date-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run fresh different-fixture production cohort
        env:
          CFI_STATUS_URL: https://cfi-football-intelligence.baoanhrat112020.workers.dev/api/status
          CFI_PREDICT_URL: https://cfi-football-intelligence.baoanhrat112020.workers.dev/api/predict
          CFI_DISCOVERY_URL: https://cfi-football-intelligence.baoanhrat112020.workers.dev/api/discover
          CFI_FEED_URL: https://kovmddkkzttquupdgmel.supabase.co/functions/v1/cfi-discovery-feed
          CFI_DB_KEY: ${{ secrets.CFI_DB_KEY || secrets.CFI_ACTION_KEY }}
        run: |
          set -euo pipefail

          STATUS=$(mktemp)
          HTTP=$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 60 -o "$STATUS" -w '%{http_code}' "$CFI_STATUS_URL")
          test "$HTTP" = "200"
          node - "$STATUS" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(body?.status!=='OK') throw new Error(`STATUS_${body?.status??'MISSING'}`);
          console.log(JSON.stringify({gate:'STATUS',result:'PASS',runtime:body?.runtime?.version??null,engine:body?.engine??body?.runtime?.engine??null},null,2));
          NODE

          if [ -z "${CFI_DB_KEY:-}" ]; then
            echo 'CFI_DB_KEY unavailable'; exit 1
          fi

          BASE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          FEED=$(mktemp)
          TARGET=''
          for OFFSET in 1 2 3; do
            DATE=$(date -u -d "$BASE +$OFFSET day" +%F)
            CODE=$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 90 -o "$FEED" -w '%{http_code}' -X POST "$CFI_FEED_URL" -H 'content-type: application/json' -H "x-cfi-key: $CFI_DB_KEY" --data "{\"target_date\":\"$DATE\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"limit\":10}")
            if [ "$CODE" = "200" ]; then
              COUNT=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));console.log(Array.isArray(x.rows)?x.rows.length:0)" "$FEED")
              if [ "$COUNT" -gt 0 ]; then TARGET="$DATE"; break; fi
            fi
          done
          if [ -z "$TARGET" ]; then echo 'NO_NEXT_DATE_COHORT'; exit 1; fi

          REQUEST=$(mktemp)
          node - "$FEED" "$REQUEST" "$TARGET" <<'NODE'
          const fs=require('fs');
          const [feedPath,outPath,targetDate]=process.argv.slice(2);
          const feed=JSON.parse(fs.readFileSync(feedPath,'utf8'));
          const oldIds=new Set(['4a0ed12b-cf3f-4c82-85e2-26e0a712cfa2','2494011','2494013']);
          const httpsOnly=v=>[...new Set((Array.isArray(v)?v:[]).map(String).filter(x=>x.startsWith('https://')))];
          const now=new Date().toISOString();
          const candidates=[];
          for(const row of (Array.isArray(feed?.rows)?feed.rows:[])){
            if(candidates.length>=5) break;
            const providerId=String(row?.providerId??row?.id??'').trim();
            const home=String(row?.home??'').trim();
            const away=String(row?.away??'').trim();
            const kickoffIso=String(row?.kickoffIso??'').trim();
            const sourceUrls=httpsOnly(row?.sourceUrls?.length?row.sourceUrls:[row?.sourceUrl]);
            if(!providerId||!home||!away||!kickoffIso||!sourceUrls.length) continue;
            if(oldIds.has(providerId)) throw new Error(`OLD_COHORT_ID_REUSED_${providerId}`);
            candidates.push({provider:String(row?.provider??'').trim()||'EXTERNAL_SUPPLIED',providerId,home,away,competition:row?.competition??null,country:row?.country??null,kickoffIso,status:'scheduled',sourceUrls,discoveredAt:String(row?.discoveredAt??'').trim()||now});
          }
          if(!candidates.length) throw new Error('NO_AUDITABLE_CANDIDATES');
          fs.writeFileSync(outPath,JSON.stringify({target_date:targetDate,timezone:'Asia/Ho_Chi_Minh',max_matches:5,response_mode:'compact',internal_provider_diagnostics:false,fixture_candidates:candidates}));
          console.log(JSON.stringify({gate:'NEW_COHORT',targetDate,candidates:candidates.map(x=>({provider:x.provider,providerId:x.providerId,match:`${x.home} vs ${x.away}`,kickoffIso:x.kickoffIso}))},null,2));
          NODE

          FIRST=$(mktemp)
          node - "$REQUEST" "$FIRST" <<'NODE'
          const fs=require('fs');
          const [requestPath,outPath]=process.argv.slice(2);
          const x=JSON.parse(fs.readFileSync(requestPath,'utf8'));
          const c=x.fixture_candidates[0];
          fs.writeFileSync(outPath,JSON.stringify({home:c.home,away:c.away,target_date:x.target_date,response_mode:'compact'}));
          NODE

          PRED=$(mktemp)
          PHTTP=$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 180 -o "$PRED" -w '%{http_code}' -X POST "$CFI_PREDICT_URL" -H 'content-type: application/json' --data-binary "@$FIRST")
          echo "PREDICT_HTTP=$PHTTP"
          test "$PHTTP" = "200"
          node - "$PRED" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ok=body?.status==='SUCCESS'||body?.status==='DATA_READY';
          const strict=body?.strictPrior?.verified===true||body?.strictPriorAudit?.evidence?.verified===true;
          const contract=body?.sixTargetMatrix?.contract??body?.presentationContract?.contract;
          const complete=body?.sixTargetMatrix?.verification?.complete===true;
          const fusion=body?.championFusion??null;
          const failures=[];
          if(!ok) failures.push(`PREDICT_STATUS_${body?.status??'MISSING'}`);
          if(!strict) failures.push('STRICT_PRIOR_NOT_VERIFIED');
          if(contract!=='CFI_2_METHODS_X_6_TARGETS_V1') failures.push(`CONTRACT_${contract??'MISSING'}`);
          if(!complete) failures.push('SIX_TARGET_INCOMPLETE');
          if(fusion && fusion?.decisionUse===true) failures.push('FUSION_UNEXPECTEDLY_ACTIONABLE');
          console.log(JSON.stringify({gate:'DIRECT_PREDICT_NEW_MATCH',result:failures.length?'FAIL':'PASS',status:body?.status??null,strictPrior:strict,contract,complete,fusionStatus:fusion?.status??null,fusionDecisionUse:fusion?.decisionUse??null,failures},null,2));
          if(failures.length) process.exit(1);
          NODE

          OUT=$(mktemp)
          DHTTP=$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 180 -o "$OUT" -w '%{http_code}' -X POST "$CFI_DISCOVERY_URL" -H 'content-type: application/json' --data-binary "@$REQUEST")
          echo "DISCOVERY_HTTP=$DHTTP"
          test "$DHTTP" = "200"
          node - "$REQUEST" "$OUT" <<'NODE'
          const fs=require('fs');
          const request=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const body=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const supplied=request.fixture_candidates;
          const byId=new Map(supplied.map(x=>[String(x.providerId),x]));
          const board=Array.isArray(body?.board)?body.board:[];
          const search=body?.search||{};
          const counts=body?.counts||{};
          const n=x=>Number(x||0);
          const failures=[];
          if(body?.status!=='OK') failures.push(`STATUS_${body?.status??'MISSING'}`);
          if(search?.mode!=='SUPPLIED_FIXTURE_ONLY'||search?.suppliedFixtureOnly!==true) failures.push('NOT_SUPPLIED_ONLY');
          if(search?.externalAcquisitionAllowed!==false||search?.canonicalFeedMerged!==false) failures.push('EXTERNAL_ACQUISITION_OR_MERGE');
          if((body?.providerAttempts||[]).length) failures.push('PROVIDER_ATTEMPTS_PRESENT');
          if(body?.rules?.noForcedFive!==true) failures.push('NO_FORCED_FIVE_MISSING');
          if(n(search?.aiCandidatesReceived)!==supplied.length) failures.push('SUPPLIED_COUNT_MISMATCH');
          if(n(counts?.fixturesDiscovered)>supplied.length||n(counts?.predictionAttempts)>supplied.length) failures.push('POOL_GREW_OUTSIDE_INPUT');
          for(const row of board){
            const expected=byId.get(String(row?.providerId));
            if(!expected){failures.push(`OUTSIDE_INPUT_${row?.providerId??'UNKNOWN'}`);continue;}
            const expectedProvider=String(expected.provider||'EXTERNAL_SUPPLIED');
            if(row?.provider!==expectedProvider) failures.push(`PROVIDER_MISMATCH_${row?.providerId}`);
            if(row?.strictPrior!==true) failures.push(`STRICT_PRIOR_FAIL_${row?.providerId}`);
            if(row?.multiMarketDecisionUse!==false) failures.push(`SHADOW_FAIL_${row?.providerId}`);
          }
          console.log(JSON.stringify({gate:'DISCOVERY_NEW_COHORT',result:failures.length?'FAIL':'PASS',targetDate:request.target_date,supplied:supplied.length,accepted:n(search?.aiCandidatesAccepted),rejected:Array.isArray(search?.aiCandidatesRejected)?search.aiCandidatesRejected.length:0,predictionAttempts:n(counts?.predictionAttempts),predictionSuccess:n(counts?.predictionSuccess),boardRows:board.length,suppliedProviders:search?.suppliedProviders??null,providerAttempts:body?.providerAttempts??[],noForcedFive:body?.rules?.noForcedFive??null,board:board.map(x=>({provider:x.provider,providerId:x.providerId,match:x.match,status:x.status,strictPrior:x.strictPrior,multiMarketDecisionUse:x.multiMarketDecisionUse})),failures},null,2));
          if(failures.length) process.exit(1);
          NODE
