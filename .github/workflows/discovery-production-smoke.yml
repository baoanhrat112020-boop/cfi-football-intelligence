name: CFI Discovery Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: cfi-production-discovery-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call production discovery once and verify health semantics
        env:
          CFI_DISCOVERY_URL: https://cfi-football-intelligence.gpt-openai.workers.dev/api/discover
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Ho_Chi_Minh date +%F)
          BODY=$(mktemp)
          HTTP=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --max-time 90 \
            -o "$BODY" -w '%{http_code}' \
            -X POST "$CFI_DISCOVERY_URL" \
            -H 'content-type: application/json' \
            --data "{\"target_date\":\"$TODAY\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"max_matches\":1,\"response_mode\":\"compact\"}")
          test "$HTTP" = "200"
          node - "$BODY" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const a = body.audit || {};
          const n = (x) => Number(x || 0);
          const failures = [];
          if (n(a.fixturesDiscovered) <= 0) failures.push('NO_REAL_FIXTURE_DISCOVERY');
          if (n(a.predictionAttempts) <= 0) failures.push('ZERO_PREDICTION_ATTEMPTS');
          if (n(a.predictionSuccess) <= 0) failures.push('ZERO_PREDICTION_SUCCESS');
          if (body.multiMarket?.decisionUse !== false && a.multiMarketDecisionUse !== false) failures.push('SHADOW_SAFETY_FAIL');
          const rejected = Array.isArray(a.rejectedFixtures) ? a.rejectedFixtures : [];
          if (n(a.fixturesDiscovered) > n(a.predictionSuccess) && rejected.length === 0) failures.push('MISSING_PER_FIXTURE_FAILURE_REASONS');
          console.log(JSON.stringify({
            status: body.status,
            fixturesDiscovered: n(a.fixturesDiscovered),
            predictionAttempts: n(a.predictionAttempts),
            predictionSuccess: n(a.predictionSuccess),
            failures
          }, null, 2));
          if (failures.length) process.exit(1);
          NODE
