name: CFI Discovery Production Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Worker deploy convergence
        run: sleep 30
      - name: Verify production status and discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          ok=0
          for i in $(seq 1 8); do
            echo "Smoke attempt $i for $TARGET_DATE"
            STATUS=$(curl -fsS --max-time 30 "$BASE/api/status" || true)
            if node -e 'const x=JSON.parse(process.argv[1]); if(x?.discovery?.supported!==true||x?.multiMarket?.decisionUse!==false)process.exit(1)' "$STATUS" 2>/dev/null; then
              DISC=$(curl -fsS --max-time 90 -H 'content-type: application/json' -d "{\"target_date\":\"$TARGET_DATE\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"max_matches\":2,\"scan_limit\":12}" "$BASE/api/discover" || true)
              if node -e 'const x=JSON.parse(process.argv[1]); if(x?.status!=="OK"||x?.action!=="CFI_DISCOVERY"||x?.version!=="CFI_AUTO_DISCOVERY_V1"||x?.rules?.strictPriorRequired!==true||x?.rules?.shadowDecisionUse!==false||!Array.isArray(x?.board))process.exit(1)' "$DISC" 2>/dev/null; then
                echo "$DISC" > /tmp/discovery.json
                ok=1
                break
              fi
            fi
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo '::error title=Production discovery smoke failed::Worker did not expose a valid /api/discover response after retries.'
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8'));
          console.log(JSON.stringify({status:x.status,targetDate:x.targetDate,provider:x.provider,counts:x.counts,final:x.final,topPicks:x.topPicks?.map(r=>({match:r.match,bestMarket:r.bestMarket,selectionScore:r.selectionScore,status:r.status}))},null,2));
          if(x.counts?.fullPredictionsExecuted>0){
            for(const r of x.board){
              if(r.strictPrior!==true)throw new Error('STRICT_PRIOR_FAIL');
              if(r.multiMarketDecisionUse!==false)throw new Error('SHADOW_DECISION_USE_FAIL');
            }
          }
          NODE
