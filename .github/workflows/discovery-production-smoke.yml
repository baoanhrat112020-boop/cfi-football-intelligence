name: CFI Discovery Production Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Worker deploy convergence
        run: sleep 45
      - name: Verify production status and discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          ok=0
          for i in $(seq 1 8); do
            echo "Smoke attempt $i for $TARGET_DATE"
            curl -fsS --max-time 30 "$BASE/api/status" -o /tmp/status.json || printf '{}\n' > /tmp/status.json
            node - <<'NODE' >/dev/null 2>&1 || { sleep 20; continue; }
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          if(x?.discovery?.supported!==true||x?.multiMarket?.decisionUse!==false)process.exit(1);
          NODE
            curl -fsS --max-time 120 -H 'content-type: application/json' \
              -d "{\"target_date\":\"$TARGET_DATE\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"max_matches\":5,\"scan_limit\":40}" \
              "$BASE/api/discover" -o /tmp/discovery.json || printf '{}\n' > /tmp/discovery.json
            if node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8')); const c=x?.counts||{};
          // CFI_AUTO_DISCOVERY_V1.3 executes raw strict-prior predictions for every scanned
          // fixture, then executes the official immutable-snapshot path only for eligible picks.
          const attempts=Number(c.scanned??0), success=Number(c.eligible??0), official=Number(c.fullPredictionsExecuted??0);
          const searchComplete=x?.search?.combinedTargetSatisfied===true||x?.search?.exhausted===true;
          const pass=x?.status==='OK'&&x?.action==='CFI_DISCOVERY'&&x?.version==='CFI_AUTO_DISCOVERY_V1.3'&&x?.provider!=='NONE'&&c.fixturesDiscovered>0&&attempts>0&&success>0&&official>0&&Array.isArray(x?.board)&&x.board.length===official&&x?.rules?.strictPriorRequired===true&&x?.rules?.shadowDecisionUse===false&&x?.rules?.continueUntilRequestedPoolOrSourcesExhausted===true&&searchComplete;
          if(!pass)process.exit(1);
          for(const r of x.board){if(r.strictPrior!==true||r.multiMarketDecisionUse!==false||!r.prediction?.sixTargetMatrix?.verification?.complete)process.exit(1);}
          NODE
            then ok=1; break; fi
            node - <<'NODE' || true
          const fs=require('fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8'))}catch{};const c=x?.counts||{};console.log(JSON.stringify({provider:x.provider,counts:c,predictionAttempts:c.scanned??0,predictionSuccess:c.eligible??0,officialPredictionExecutions:c.fullPredictionsExecuted??0,board:(x.board||[]).map(r=>({match:r.match,strictPrior:r.strictPrior,consistency:r.consistency,multiMarketStatus:r.multiMarketStatus,status:r.status})),final:x.final}));
          NODE
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo '::error title=Production discovery smoke failed::No auditable real strict-prior production prediction after retries.'
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8')); const c=x?.counts||{};
          const summary={
            status:x.status,
            version:x.version,
            targetDate:x.targetDate,
            provider:x.provider,
            counts:{...c,predictionAttempts:c.scanned??0,predictionSuccess:c.eligible??0,officialPredictionExecutions:c.fullPredictionsExecuted??0},
            final:x.final,
            board:x.board?.map(r=>({
              match:r.match,
              home:r.home,
              away:r.away,
              competition:r.competition,
              kickoff:r.kickoff,
              kickoffLocal:r.kickoffLocal,
              bestMarket:r.bestMarket,
              modelProbability:r.modelProbability,
              fairOdds:r.fairOdds,
              selectionScore:r.selectionScore,
              status:r.status,
              strictPrior:r.strictPrior,
              consistency:r.consistency,
              multiMarketStatus:r.multiMarketStatus,
              multiMarketDecisionUse:r.multiMarketDecisionUse,
              snapshotId:r.prediction?.audit?.body?.snapshotId||null,
              champion:r.prediction?.sixTargetMatrix||null,
              scoreline:r.prediction?.scoreline||null,
              marketSummary:r.prediction?.outputV3?.marketSummary||r.marketSummary||null,
              explosionScenario:r.prediction?.outputV3?.explosionScenario||null,
              evidenceSufficiency:r.prediction?.outputV3?.evidenceSufficiency||null,
              betLedger:r.prediction?.outputV3?.betLedger||null
            }))
          };
          fs.writeFileSync('/tmp/discovery-summary.json',JSON.stringify(summary,null,2)); console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Publish smoke evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          if [ ! -f /tmp/discovery-summary.json ]; then
            echo '::warning::discovery-summary.json missing; production verification step owns pass/fail.'
            exit 0
          fi

          {
            echo '## CFI Discovery Production Smoke'
            echo
            echo '```json'
            cat /tmp/discovery-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          TITLE='[AUTO] CFI Discovery Production Smoke'
          BODY=$(cat /tmp/discovery-summary.json)
          REPORT=$(printf 'Run: %s\nCommit: %s\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$BODY")

          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '.[] | select(.title=="[AUTO] CFI Discovery Production Smoke") | .number' \
            2>/dev/null | head -n1 || true)

          if [ -n "${ISSUE:-}" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$REPORT" \
              || echo "::warning::Could not publish smoke evidence to issue #$ISSUE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$REPORT" \
              || echo '::warning::Could not create smoke evidence issue'
          fi
