name: CFI Discovery Production Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Worker deploy convergence
        run: sleep 30
      - name: Verify production status and discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          ok=0
          for i in $(seq 1 8); do
            echo "Smoke attempt $i for $TARGET_DATE"
            curl -fsS --max-time 30 "$BASE/api/status" -o /tmp/status.json || printf '{}\n' > /tmp/status.json
            node - <<'NODE' >/dev/null 2>&1 || { sleep 20; continue; }
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          if(x?.discovery?.supported!==true||x?.multiMarket?.decisionUse!==false)process.exit(1);
          NODE
            curl -fsS --max-time 120 -H 'content-type: application/json' \
              -d "{\"target_date\":\"$TARGET_DATE\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"max_matches\":5,\"scan_limit\":40}" \
              "$BASE/api/discover" -o /tmp/discovery.json || printf '{}\n' > /tmp/discovery.json
            if node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8')); const c=x?.counts||{};
          const pass=x?.status==='OK'&&x?.action==='CFI_DISCOVERY'&&x?.version==='CFI_AUTO_DISCOVERY_V1.1'&&x?.provider!=='NONE'&&c.fixturesDiscovered>0&&c.predictionAttempts>0&&c.fullPredictionsExecuted===c.predictionAttempts&&typeof c.predictionSuccess==='number'&&c.predictionSuccess>0&&Array.isArray(x?.diagnostics)&&x.diagnostics.length===c.fixturesDiscovered&&x?.rules?.strictPriorRequired===true&&x?.rules?.shadowDecisionUse===false&&Array.isArray(x?.board)&&x.board.length>0;
          if(!pass)process.exit(1);
          for(const d of x.diagnostics){if(d.predictionStatus!=='SUCCESS'&&d.predictionStatus!=='DATA_READY'&&!d.reasonCode)process.exit(1);}
          for(const r of x.board){if(r.strictPrior!==true||r.multiMarketDecisionUse!==false)process.exit(1);}
          NODE
            then ok=1; break; fi
            node - <<'NODE' || true
          const fs=require('fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8'))}catch{};console.log(JSON.stringify({provider:x.provider,counts:x.counts,diagnostics:x.diagnostics,final:x.final}));
          NODE
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo '::error title=Production discovery smoke failed::No auditable real fixture prediction execution after retries.'
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8'));
          const summary={status:x.status,version:x.version,targetDate:x.targetDate,provider:x.provider,counts:x.counts,diagnostics:x.diagnostics,final:x.final,board:x.board?.map(r=>({match:r.match,home:r.home,away:r.away,competition:r.competition,kickoff:r.kickoff,kickoffLocal:r.kickoffLocal,bestMarket:r.bestMarket,modelProbability:r.modelProbability,fairOdds:r.fairOdds,selectionScore:r.selectionScore,status:r.status,strictPrior:r.strictPrior,consistency:r.consistency,multiMarketStatus:r.multiMarketStatus,multiMarketDecisionUse:r.multiMarketDecisionUse,snapshotId:r.prediction?.audit?.body?.snapshotId||null,champion:r.prediction?.sixTargetMatrix||null,scoreline:r.prediction?.scoreline||null,multiMarket:r.prediction?.multiMarket||null,outputV2:r.prediction?.outputV2||null,bettingBoard:r.prediction?.bettingBoard||null}))};
          fs.writeFileSync('/tmp/discovery-summary.json',JSON.stringify(summary,null,2)); console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Publish smoke evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[AUTO] CFI Discovery Production Smoke'; BODY=$(cat /tmp/discovery-summary.json)
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title=="[AUTO] CFI Discovery Production Smoke") | .number' | head -n1)
          REPORT=$(printf 'Run: %s\nCommit: %s\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$BODY")
          if [ -n "${ISSUE:-}" ]; then gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$REPORT"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$REPORT"; fi
