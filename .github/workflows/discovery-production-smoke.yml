name: CFI Discovery Production Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: cfi-discovery-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Worker deploy convergence
        run: sleep 30
      - name: Verify production status and discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          ok=0; DISC='{}'; STATUS='{}'
          for i in $(seq 1 8); do
            echo "Smoke attempt $i for $TARGET_DATE"
            STATUS=$(curl -fsS --max-time 30 "$BASE/api/status" || true)
            echo "STATUS=$STATUS"
            if node -e 'const x=JSON.parse(process.argv[1]); if(x?.discovery?.supported!==true||x?.multiMarket?.decisionUse!==false)process.exit(1)' "$STATUS" 2>/dev/null; then
              DISC=$(curl -fsS --max-time 120 -H 'content-type: application/json' -d "{\"target_date\":\"$TARGET_DATE\",\"timezone\":\"Asia/Ho_Chi_Minh\",\"max_matches\":5,\"scan_limit\":40}" "$BASE/api/discover" || true)
              echo "DISC=$DISC"
              if node -e 'const x=JSON.parse(process.argv[1]); const c=x?.counts||{}; if(x?.status!=="OK"||x?.action!=="CFI_DISCOVERY"||x?.version!=="CFI_AUTO_DISCOVERY_V1.1"||x?.provider==="NONE"||!(c.fixturesDiscovered>0)||!(c.predictionAttempts>0)||c.fullPredictionsExecuted!==c.predictionAttempts||typeof c.predictionSuccess!=="number"||!Array.isArray(x?.diagnostics)||x.diagnostics.length!==c.fixturesDiscovered||x?.rules?.strictPriorRequired!==true||x?.rules?.shadowDecisionUse!==false||!Array.isArray(x?.board))process.exit(1); if(c.predictionSuccess===0&&!x.diagnostics.every(d=>d.reasonCode&&d.failureLayer))process.exit(1)' "$DISC" 2>/dev/null; then
                echo "$DISC" > /tmp/discovery.json; ok=1; break
              fi
            fi
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            printf '%s\n' "$STATUS" > /tmp/status-failure.json 2>/dev/null || true
            printf '%s\n' "$DISC" > /tmp/discovery-failure.json 2>/dev/null || true
            echo '::error title=Production discovery smoke failed::No auditable real fixture prediction execution after retries.'
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8'));
          const summary={status:x.status,version:x.version,targetDate:x.targetDate,provider:x.provider,counts:x.counts,diagnostics:x.diagnostics,final:x.final,board:x.board?.map(r=>({match:r.match,bestMarket:r.bestMarket,selectionScore:r.selectionScore,status:r.status,strictPrior:r.strictPrior,multiMarketStatus:r.multiMarketStatus}))};
          fs.writeFileSync('/tmp/discovery-summary.json',JSON.stringify(summary,null,2)); console.log(JSON.stringify(summary,null,2));
          for(const r of x.board){if(r.strictPrior!==true)throw new Error('STRICT_PRIOR_FAIL');if(r.multiMarketDecisionUse!==false)throw new Error('SHADOW_DECISION_USE_FAIL');}
          NODE
      - name: Publish smoke evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[AUTO] CFI Discovery Production Smoke'; BODY=$(cat /tmp/discovery-summary.json)
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title=="[AUTO] CFI Discovery Production Smoke") | .number' | head -n1)
          REPORT=$(printf 'Run: %s\nCommit: %s\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$BODY")
          if [ -n "${ISSUE:-}" ]; then gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$REPORT"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$REPORT"; fi
