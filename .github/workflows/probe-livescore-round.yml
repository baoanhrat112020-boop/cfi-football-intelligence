name: Probe Livescore round fields (read-only)

on:
  workflow_dispatch:
  push:
    branches: [tmp/probe-livescore-round]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi
      - name: Probe
        run: |
          python3 - <<'PY'
          import json, time, unicodedata
          from collections import defaultdict, Counter
          from datetime import datetime, timedelta
          from curl_cffi import requests as cf
          def fold(s):
              s = unicodedata.normalize("NFKD", s or "")
              return "".join(c for c in s if not unicodedata.category(c).startswith("M")).lower()
          TARGET = {
              ("england", "premier league"): "EPL", ("spain", "laliga"): "LaLiga", ("spain", "la liga"): "LaLiga",
              ("germany", "bundesliga"): "Bundesliga", ("italy", "serie a"): "SerieA", ("france", "ligue 1"): "Ligue1",
              ("netherlands", "eredivisie"): "Eredivisie", ("portugal", "liga portugal"): "Portugal",
              ("portugal", "primeira liga"): "Portugal", ("belgium", "pro league"): "Belgium",
              ("belgium", "jupiler pro league"): "Belgium", ("turkiye", "super lig"): "Turkey", ("turkey", "super lig"): "Turkey",
              ("scotland", "premiership"): "Scotland",
          }
          tot = defaultdict(lambda: Counter()); rounds = defaultdict(Counter); names = defaultdict(set)
          today = datetime.utcnow().date()
          failed = 0
          for off in range(1, 36):
              ymd = (today - timedelta(days=off)).strftime("%Y%m%d")
              url = f"https://prod-cdn-mev-api.livescore.com/v1/api/app/date/soccer/{ymd}/0?MD=1"
              try:
                  r = cf.get(url, impersonate="chrome120", timeout=25)
              except Exception as e:
                  failed += 1; print("ERR", ymd, e); continue
              if r.status_code != 200:
                  failed += 1; print("HTTP", ymd, r.status_code); continue
              for s in json.loads(r.text).get("Stages", []):
                  key = (fold(s.get("Cnm")), fold(s.get("Snm")))
                  lab = TARGET.get(key)
                  if not lab:
                      continue
                  names[lab].add(f"{s.get('Cnm')}|{s.get('Snm')}")
                  for ev in s.get("Events", []):
                      tot[lab]["events"] += 1
                      if ev.get("Eps") == "FT":
                          tot[lab]["FT"] += 1
                          if ev.get("Trh1") is not None and ev.get("Trh2") is not None:
                              tot[lab]["FT_with_HT"] += 1
                      rounds[lab][str(ev.get("ErnInf"))] += 1
              time.sleep(0.4)
          print("days_failed", failed)
          for lab in sorted(set(TARGET.values())):
              print(lab, dict(tot[lab]), "stages", sorted(names[lab]))
              print("   ErnInf values:", sorted(rounds[lab].items(), key=lambda x: (len(x[0]), x[0]))[:45])
          PY
