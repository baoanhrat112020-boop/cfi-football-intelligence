name: Production E2E Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-e2e-smoke.yml'
      - 'cloudflare-worker/**'
      - 'src/prediction/**'
      - 'src/runtime/**'
      - 'wrangler.jsonc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-e2e-smoke.yml'
      - 'cloudflare-worker/**'
      - 'src/prediction/**'
      - 'src/runtime/**'
      - 'wrangler.jsonc'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate Chrome
        id: chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner" >&2
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version
      - name: Install Playwright core
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - name: Verify production countdown and LIVE routing in real Chromium
        env:
          BASE_URL: https://cfi-football-intelligence.baoanhrat112020.workers.dev
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';

          const base=process.env.BASE_URL.replace(/\/$/,'');
          const today=new Date().toISOString().slice(0,10);
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
          const context=await browser.newContext({
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
            extraHTTPHeaders:{accept:'application/json,text/plain,*/*','accept-language':'en-US,en;q=0.9'}
          });
          const page=await context.newPage();
          page.setDefaultTimeout(30000);

          async function readResponse(response){
            let body={};
            try{body=await response.json()}catch{body={raw:await response.text().catch(()=> '')}}
            return {status:response.status(),body};
          }
          async function post(path,payload){
            return await page.evaluate(async({path,payload})=>{
              const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify(payload)});
              let body={}; try{body=await r.json()}catch{body={raw:await r.text()}}
              return {status:r.status,body};
            },{path,payload});
          }

          try{
            const statusResponse=await page.goto(base+'/api/status',{waitUntil:'domcontentloaded',timeout:30000});
            if(!statusResponse) throw new Error('NO_STATUS_RESPONSE');
            const status=await readResponse(statusResponse);
            if(status.status!==200) throw new Error('STATUS_HTTP_'+status.status+': '+JSON.stringify(status.body));
            const runtime=status.body?.runtime??{};
            if(runtime.productionEntrypoint!=='index-live-router.ts') throw new Error('BAD_PRODUCTION_ENTRYPOINT: '+JSON.stringify(runtime));
            if(runtime.prematchEntrypoint!=='index-v55.ts') throw new Error('BAD_PREMATCH_ENTRYPOINT: '+JSON.stringify(runtime));

            const home='CFI E2E NONEXISTENT HOME 9F3A7C';
            const away='CFI E2E NONEXISTENT AWAY 4D2B8E';

            const countdown=await post('/api/predict-live',{home,away,status:'COUNTDOWN',clientLocalDate:today,language:'vi'});
            if(countdown.status!==422 || countdown.body?.status!=='INSUFFICIENT_DATA') throw new Error('COUNTDOWN_FAIL: '+JSON.stringify(countdown));
            const route=countdown.body?.matchStateRouting??{};
            for(const [k,v] of Object.entries({classifiedAs:'PREMATCH',requestedEndpoint:'/api/predict-live',executedEndpoint:'/api/predict',targetDate:today,targetDateSource:'clientLocalDate'})){
              if(route[k]!==v) throw new Error(`COUNTDOWN_ROUTE_${k}: ${JSON.stringify(route)}`);
            }

            const missing=await post('/api/predict-live',{home,away,status:'COUNTDOWN',language:'vi'});
            if(missing.status!==400 || missing.body?.error!=='TARGET_DATE_REQUIRED') throw new Error('MISSING_DATE_FAIL: '+JSON.stringify(missing));
            const missingRoute=missing.body?.matchStateRouting??{};
            if(missingRoute.classifiedAs!=='PREMATCH' || missingRoute.executedEndpoint!==null || missingRoute.reason!=='PRE_KICKOFF_TARGET_DATE_UNRESOLVED') throw new Error('MISSING_DATE_ROUTE_FAIL: '+JSON.stringify(missingRoute));

            const live=await post('/api/predict-live',{home,away,status:'COUNTDOWN',live:{period:'1H',minute:1,homeGoals:0,awayGoals:0},language:'vi'});
            if(live.status!==400 || live.body?.error!=='TARGET_DATE_REQUIRED') throw new Error('LIVE_FAIL_CLOSED: '+JSON.stringify(live));
            if(live.body?.runtime?.predictionPath!=='LIVE_PRIOR_STRICT_FAIL_CLOSED') throw new Error('LIVE_PATH_FAIL: '+JSON.stringify(live.body?.runtime));

            console.log(JSON.stringify({status:'PASS',runtime,countdownRouting:route,missingDateRouting:missingRoute,liveRuntime:live.body?.runtime},null,2));
          } finally {
            await browser.close();
          }
          JS
