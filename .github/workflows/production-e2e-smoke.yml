name: Production E2E Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-e2e-smoke.yml'
      - 'cloudflare-worker/**'
      - 'src/prediction/**'
      - 'src/runtime/**'
      - 'wrangler.jsonc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-e2e-smoke.yml'
      - 'cloudflare-worker/**'
      - 'src/prediction/**'
      - 'src/runtime/**'
      - 'wrangler.jsonc'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production with ChatGPT-style client signature
        env:
          BASE_URL: https://cfi-football-intelligence.baoanhrat112020.workers.dev
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile, datetime

          base=os.environ['BASE_URL'].rstrip('/')
          today=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          ua='ChatGPT-User/1.0'

          def call(method,path,payload=None):
              with tempfile.NamedTemporaryFile() as body:
                  cmd=['curl','-sS','--connect-timeout','10','--max-time','25','-A',ua,'-H','Accept: application/json','-o',body.name,'-w','%{http_code}','-X',method]
                  if payload is not None:
                      cmd += ['-H','Content-Type: application/json','--data-binary',json.dumps(payload)]
                  cmd += [base+path]
                  p=subprocess.run(cmd,text=True,capture_output=True)
                  body.seek(0); raw=body.read().decode(errors='replace')
                  if p.returncode!=0:
                      raise RuntimeError(f'curl rc={p.returncode} stderr={p.stderr.strip()} body={raw[:1000]}')
                  code=int(p.stdout.strip())
                  try: parsed=json.loads(raw) if raw else {}
                  except Exception: parsed={'raw':raw}
                  return code,parsed

          s_status,s=call('GET','/api/status')
          if s_status!=200: raise SystemExit('STATUS_FAIL '+json.dumps({'http':s_status,'body':s},ensure_ascii=False))
          runtime=s.get('runtime') or {}
          assert runtime.get('productionEntrypoint')=='index-live-router.ts',runtime
          assert runtime.get('prematchEntrypoint')=='index-v55.ts',runtime

          home='CFI E2E NONEXISTENT HOME 9F3A7C'; away='CFI E2E NONEXISTENT AWAY 4D2B8E'
          c_status,c=call('POST','/api/predict-live',{'home':home,'away':away,'status':'COUNTDOWN','clientLocalDate':today,'language':'vi'})
          assert c_status==422,(c_status,c)
          assert c.get('status')=='INSUFFICIENT_DATA',c
          route=c.get('matchStateRouting') or {}
          assert route.get('classifiedAs')=='PREMATCH',route
          assert route.get('requestedEndpoint')=='/api/predict-live',route
          assert route.get('executedEndpoint')=='/api/predict',route
          assert route.get('targetDate')==today,route
          assert route.get('targetDateSource')=='clientLocalDate',route

          m_status,m=call('POST','/api/predict-live',{'home':home,'away':away,'status':'COUNTDOWN','language':'vi'})
          assert m_status==400,(m_status,m)
          assert m.get('error')=='TARGET_DATE_REQUIRED',m
          mroute=m.get('matchStateRouting') or {}
          assert mroute.get('classifiedAs')=='PREMATCH',mroute
          assert mroute.get('executedEndpoint') is None,mroute
          assert mroute.get('reason')=='PRE_KICKOFF_TARGET_DATE_UNRESOLVED',mroute

          l_status,l=call('POST','/api/predict-live',{'home':home,'away':away,'status':'COUNTDOWN','live':{'period':'1H','minute':1,'homeGoals':0,'awayGoals':0},'language':'vi'})
          assert l_status==400,(l_status,l)
          assert l.get('error')=='TARGET_DATE_REQUIRED',l
          assert (l.get('runtime') or {}).get('predictionPath')=='LIVE_PRIOR_STRICT_FAIL_CLOSED',l

          print(json.dumps({'status':'PASS','userAgent':ua,'runtime':runtime,'countdownRouting':route,'missingDateRouting':mroute,'liveRuntime':l.get('runtime')},ensure_ascii=False,indent=2))
          PY
