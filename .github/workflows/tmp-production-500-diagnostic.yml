name: TMP Production 500 Diagnostic

on:
  push:
    branches: [fix/production-500-fusion-instructions]
    paths:
      - '.github/workflows/tmp-production-500-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture production prediction response
        run: |
          set -euo pipefail
          BODY=$(mktemp)
          HTTP=$(curl --silent --show-error --max-time 180 -o "$BODY" -w '%{http_code}' \
            -X POST 'https://cfi-football-intelligence.baoanhrat112020.workers.dev/api/predict' \
            -H 'content-type: application/json' \
            --data '{"home":"Freiburg","away":"Motherwell","target_date":"2026-08-27","language":"vi"}')
          echo "HTTP=$HTTP"
          node - "$BODY" <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            status:body.status,error:body.error,message:body.message,
            topLevelKeys:Object.keys(body).sort(),
            runtime:body.runtime,
            strictPrior:body.strictPrior,
            temporalEvidenceAudit:body.temporalEvidenceAudit,
            championFusion:body.championFusion&&{version:body.championFusion.version,status:body.championFusion.status,reason:body.championFusion.reason,decisionUse:body.championFusion.decisionUse},
            outputV3Fusion:body.outputV3?.championFusion&&{version:body.outputV3.championFusion.version,status:body.outputV3.championFusion.status,decisionUse:body.outputV3.championFusion.decisionUse},
            renderedHasFusion:typeof body.renderedReport==='string'&&body.renderedReport.includes('CHAMPION FUSION'),
            practicalHasFusion:typeof body.outputV3?.renderedPracticalReport==='string'&&body.outputV3.renderedPracticalReport.includes('CHAMPION FUSION')
          },null,2));
          NODE
