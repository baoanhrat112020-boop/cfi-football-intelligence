name: CFI Daily Fixture Auto E2E

on:
  pull_request:
    paths:
      - 'src/discovery/**'
      - 'local-node/registry/**'
      - 'local-node/browser/fixture-collector/**'
      - 'local-node/orchestrator.mjs'
      - 'tools/cfi-daily-fixture-auto-e2e.mjs'
      - 'tests/daily-fixture-registry.test.mjs'
      - 'tests/registry-source-adapters.test.mjs'
      - 'tests/fixture-source-policy.test.mjs'
      - 'tests/fixture-verification.test.mjs'
      - 'tests/rolling-evidence-queues.test.mjs'
      - 'tests/shadow-evidence-dispatcher.test.mjs'
      - 'tests/shadow-evidence-dispatcher-runner.test.mjs'
      - 'tests/daily-text-parser.test.mjs'
      - 'tests/tier-a-registry-coverage.test.mjs'
      - 'package.json'
      - '.github/workflows/cfi-daily-fixture-auto-e2e.yml'
  workflow_dispatch:

concurrency:
  group: cfi-daily-fixture-auto-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-auto-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TZ: Asia/Ho_Chi_Minh
      CFI_TIME_ZONE: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Syntax check Tier A browser orchestration, queues and dispatcher
        run: |
          node --check src/discovery/fixture-verification.mjs
          node --check src/discovery/rolling-evidence-queues.mjs
          node --check src/discovery/shadow-evidence-dispatcher.mjs
          node --check local-node/browser/fixture-collector/probe.mjs
          node --check local-node/browser/fixture-collector/daily-text-parser.mjs
          node --check local-node/browser/fixture-collector/run-daily-source-adapter.mjs
          node --check local-node/registry/tier-a-browser-discovery.mjs
          node --check local-node/registry/daily-fixture-registry.mjs
          node --check local-node/registry/rolling-evidence-queues.mjs
          node --check local-node/registry/shadow-evidence-dispatcher.mjs
          node --check local-node/orchestrator.mjs

      - name: Deterministic registry, verification, queue and dispatcher contract tests
        run: >-
          node --experimental-strip-types --test
          tests/daily-fixture-registry.test.mjs
          tests/registry-source-adapters.test.mjs
          tests/fixture-source-policy.test.mjs
          tests/fixture-verification.test.mjs
          tests/rolling-evidence-queues.test.mjs
          tests/shadow-evidence-dispatcher.test.mjs
          tests/shadow-evidence-dispatcher-runner.test.mjs
          tests/daily-text-parser.test.mjs
          tests/tier-a-registry-coverage.test.mjs

      - name: Materialize physical queues and no-network shadow evidence receipts
        run: |
          mkdir -p local-node/cache/registry
          cat > local-node/cache/registry/rolling-fixture-window.json <<'JSON'
          {
            "generatedAt":"2026-09-05T00:00:00.000Z",
            "targetDate":"2026-09-05",
            "timeZone":"Asia/Ho_Chi_Minh",
            "horizonMinutes":90,
            "fixtures":[
              {
                "identityKey":"verified|fixture|2026-09-05",
                "targetDate":"2026-09-05",
                "home":"Verified Home",
                "away":"Verified Away",
                "kickoffIso":"2026-09-05T01:00:00.000Z",
                "kickoffLocal":"08:00",
                "minutesToKickoff":30,
                "rankingReady":true,
                "rankingVerificationStatus":"MULTI_SOURCE_VERIFIED",
                "trustedVerification":{"needsCrossCheck":false,"trustedProviders":["BONGDAWAP","FLASHSCORE"],"trustedLiveProviders":["BONGDAWAP","FLASHSCORE"]}
              },
              {
                "identityKey":"single|fixture|2026-09-05",
                "targetDate":"2026-09-05",
                "home":"Single Home",
                "away":"Single Away",
                "kickoffIso":"2026-09-05T01:15:00.000Z",
                "kickoffLocal":"08:15",
                "minutesToKickoff":45,
                "rankingReady":false,
                "rankingVerificationStatus":"SINGLE_TRUSTED_SOURCE_OBSERVED",
                "trustedVerification":{"needsCrossCheck":true,"trustedProviders":["FLASHSCORE"],"trustedLiveProviders":["FLASHSCORE"]}
              }
            ]
          }
          JSON
          npm run cfi:queues
          npm run cfi:evidence:shadow
          node - <<'NODE'
          const fs = require('fs');
          const verified = JSON.parse(fs.readFileSync('local-node/cache/registry/verified-ranking-queue.json','utf8'));
          const crosscheck = JSON.parse(fs.readFileSync('local-node/cache/registry/crosscheck-required-queue.json','utf8'));
          const plan = JSON.parse(fs.readFileSync('local-node/cache/registry/evidence-request-plan.json','utf8'));
          const queueAudit = JSON.parse(fs.readFileSync('local-node/cache/registry/rolling-evidence-queues-audit.json','utf8'));
          const receipts = JSON.parse(fs.readFileSync('local-node/cache/registry/shadow-evidence-receipts.json','utf8'));
          const webPlan = JSON.parse(fs.readFileSync('local-node/cache/registry/web-crosscheck-request-plan.json','utf8'));
          const reverify = JSON.parse(fs.readFileSync('local-node/cache/registry/next-cycle-reverification-candidates.json','utf8'));
          const dispatchAudit = JSON.parse(fs.readFileSync('local-node/cache/registry/shadow-evidence-dispatcher-audit.json','utf8'));
          if (verified.count !== 1) throw new Error('VERIFIED_QUEUE_EXPECTED_1');
          if (crosscheck.count !== 1) throw new Error('CROSSCHECK_QUEUE_EXPECTED_1');
          if (plan.count !== 2) throw new Error('EVIDENCE_REQUEST_PLAN_EXPECTED_2');
          if (queueAudit.metrics?.droppedByQuota !== 0) throw new Error('QUEUE_DROPPED_BY_QUOTA');
          if (plan.requests?.some(x => x.safety?.predictionExecutionAllowed !== false)) throw new Error('PREDICTION_EXECUTION_ENABLED');
          if (plan.requests?.some(x => x.bigDb?.writeAllowed !== false)) throw new Error('BIGDB_WRITE_ENABLED');
          if (plan.requests?.[0]?.bigDb?.implementation !== 'supabase/functions/cfi-bigdb-retrieval') throw new Error('BIGDB_PIPELINE_NOT_REUSED');
          if (plan.webRescueImplementation !== 'local-node/registry/web-search-rescue.mjs') throw new Error('WEB_RESCUE_PIPELINE_NOT_REUSED');
          if (receipts.count !== 2) throw new Error('SHADOW_RECEIPTS_EXPECTED_2');
          if (receipts.rows?.some(x => x.bigDb?.status !== 'NOT_DISPATCHED_SHADOW')) throw new Error('DEFAULT_SHADOW_MUST_NOT_NETWORK');
          if (receipts.rows?.some(x => x.rankingReady !== false || x.predictionExecutionAllowed !== false)) throw new Error('SHADOW_RECEIPT_PROMOTION_OR_PREDICTION');
          if (webPlan.count !== 2) throw new Error('WEB_CROSSCHECK_PLAN_EXPECTED_2');
          if (reverify.count !== 0) throw new Error('NO_NETWORK_SHOULD_NOT_REVERIFY');
          if (dispatchAudit.status !== 'PASS_SHADOW_NO_NETWORK') throw new Error(`UNEXPECTED_DISPATCH_STATUS:${dispatchAudit.status}`);
          if (dispatchAudit.liveRead?.serviceRoleKeyUsed !== false) throw new Error('SERVICE_ROLE_KEY_USED');
          if (dispatchAudit.integration?.sameCycleRegistryMutationPerformed !== false) throw new Error('SAME_CYCLE_REGISTRY_MUTATION');
          console.log(JSON.stringify({status:'PASS',verified:verified.count,crosscheck:crosscheck.count,evidenceRequests:plan.count,receipts:receipts.count,webCrosschecks:webPlan.count,reverify:reverify.count,dispatchStatus:dispatchAudit.status}));
          NODE

      - name: Build prioritized source scan plan
        run: npm run cfi:source-plan

      - name: Verify source priority policy
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('local-node/cache/registry/source-scan-plan.json', 'utf8'));
          const expected = ['AISCORE','BONGDAWAP','SOFASCORE','FLASHSCORE'];
          if (JSON.stringify(plan.primaryOrder) !== JSON.stringify(expected)) {
            throw new Error(`PRIMARY_SOURCE_ORDER_INVALID:${JSON.stringify(plan.primaryOrder)}`);
          }
          if (plan.rules?.espnCanSatisfyCoverageReadiness !== false) throw new Error('ESPN_COVERAGE_AUTHORITY_INVALID');
          if (plan.rules?.theSportsDbCanSatisfyCoverageReadiness !== false) throw new Error('TSDB_COVERAGE_AUTHORITY_INVALID');
          if (plan.rules?.stopAfterRowQuota !== false) throw new Error('ROW_QUOTA_EARLY_STOP_NOT_DISABLED');
          console.log(JSON.stringify({status:'PASS', primaryOrder:plan.primaryOrder, secondaryOrder:plan.secondaryOrder, fallbackOrder:plan.fallbackOrder}));
          NODE

      - name: Shadow Auto E2E with live public smoke
        run: npm run cfi:auto-e2e

      - name: Verify shadow safety flags
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-reports/cfi-daily-fixture-auto-e2e.json', 'utf8'));
          if (report.status !== 'PASS') throw new Error(`AUTO_E2E_${report.status}`);
          if (report.safety?.decisionUse !== false) throw new Error('DECISION_USE_NOT_FALSE');
          if (report.safety?.bigDbWriteAllowed !== false) throw new Error('BIGDB_WRITE_ALLOWED');
          if (report.safety?.productionScheduleActivated !== false) throw new Error('PRODUCTION_SCHEDULE_ACTIVATED');
          if (report.deterministic?.cycle1?.matrix?.rescuedByTierABrowser < 1) throw new Error('TIER_A_BROWSER_RESCUE_NOT_PROVEN');
          if (report.deterministic?.cycle1?.matrix?.rescuedWithoutPcNode < 3) throw new Error('PC_MISS_RESCUE_NOT_PROVEN');
          if (report.deterministic?.sourceFailureCycle?.matrix?.unionFixtures !== 4) throw new Error('SOURCE_FAILURE_RETENTION_NOT_PROVEN');
          if (report.deterministic?.conflictCycle?.verificationStatus !== 'CONFLICT_FAIL_CLOSED') throw new Error('CONFLICT_FAIL_CLOSED_NOT_PROVEN');
          console.log(JSON.stringify({status:'PASS', safety:report.safety, deterministic:report.deterministic, livePublic:report.livePublic}));
          NODE

      - name: Upload Auto E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfi-daily-fixture-auto-e2e-${{ github.run_id }}
          path: |
            audit-reports/cfi-daily-fixture-auto-e2e.json
            audit-reports/cfi-daily-fixture-auto-e2e.md
            local-node/cache/registry/source-scan-plan.json
            local-node/cache/registry/rolling-evidence-queue-set.json
            local-node/cache/registry/verified-ranking-queue.json
            local-node/cache/registry/crosscheck-required-queue.json
            local-node/cache/registry/evidence-request-plan.json
            local-node/cache/registry/rolling-evidence-queues-audit.json
            local-node/cache/registry/shadow-evidence-receipts.json
            local-node/cache/registry/web-crosscheck-request-plan.json
            local-node/cache/registry/next-cycle-reverification-candidates.json
            local-node/cache/registry/shadow-evidence-dispatcher-audit.json
          if-no-files-found: warn
