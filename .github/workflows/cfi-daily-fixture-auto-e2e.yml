name: CFI Daily Fixture Auto E2E

on:
  pull_request:
    paths:
      - 'src/discovery/**'
      - 'local-node/registry/**'
      - 'local-node/browser/fixture-collector/**'
      - 'local-node/orchestrator.mjs'
      - 'tools/cfi-daily-fixture-auto-e2e.mjs'
      - 'tests/daily-fixture-registry.test.mjs'
      - 'tests/registry-source-adapters.test.mjs'
      - 'tests/fixture-source-policy.test.mjs'
      - 'tests/daily-text-parser.test.mjs'
      - 'tests/tier-a-registry-coverage.test.mjs'
      - 'package.json'
      - '.github/workflows/cfi-daily-fixture-auto-e2e.yml'
  workflow_dispatch:

concurrency:
  group: cfi-daily-fixture-auto-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-auto-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TZ: Asia/Ho_Chi_Minh
      CFI_TIME_ZONE: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Syntax check Tier A browser orchestration
        run: |
          node --check local-node/browser/fixture-collector/probe.mjs
          node --check local-node/browser/fixture-collector/daily-text-parser.mjs
          node --check local-node/browser/fixture-collector/run-daily-source-adapter.mjs
          node --check local-node/registry/tier-a-browser-discovery.mjs
          node --check local-node/registry/daily-fixture-registry.mjs
          node --check local-node/orchestrator.mjs

      - name: Deterministic registry, source-policy and Tier A parser contract tests
        run: >-
          node --experimental-strip-types --test
          tests/daily-fixture-registry.test.mjs
          tests/registry-source-adapters.test.mjs
          tests/fixture-source-policy.test.mjs
          tests/daily-text-parser.test.mjs
          tests/tier-a-registry-coverage.test.mjs

      - name: Build prioritized source scan plan
        run: npm run cfi:source-plan

      - name: Verify source priority policy
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('local-node/cache/registry/source-scan-plan.json', 'utf8'));
          const expected = ['AISCORE','BONGDAWAP','SOFASCORE','FLASHSCORE'];
          if (JSON.stringify(plan.primaryOrder) !== JSON.stringify(expected)) {
            throw new Error(`PRIMARY_SOURCE_ORDER_INVALID:${JSON.stringify(plan.primaryOrder)}`);
          }
          if (plan.rules?.espnCanSatisfyCoverageReadiness !== false) throw new Error('ESPN_COVERAGE_AUTHORITY_INVALID');
          if (plan.rules?.theSportsDbCanSatisfyCoverageReadiness !== false) throw new Error('TSDB_COVERAGE_AUTHORITY_INVALID');
          if (plan.rules?.stopAfterRowQuota !== false) throw new Error('ROW_QUOTA_EARLY_STOP_NOT_DISABLED');
          console.log(JSON.stringify({status:'PASS', primaryOrder:plan.primaryOrder, secondaryOrder:plan.secondaryOrder, fallbackOrder:plan.fallbackOrder}));
          NODE

      - name: Shadow Auto E2E with live public smoke
        run: npm run cfi:auto-e2e

      - name: Verify shadow safety flags
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-reports/cfi-daily-fixture-auto-e2e.json', 'utf8'));
          if (report.status !== 'PASS') throw new Error(`AUTO_E2E_${report.status}`);
          if (report.safety?.decisionUse !== false) throw new Error('DECISION_USE_NOT_FALSE');
          if (report.safety?.bigDbWriteAllowed !== false) throw new Error('BIGDB_WRITE_ALLOWED');
          if (report.safety?.productionScheduleActivated !== false) throw new Error('PRODUCTION_SCHEDULE_ACTIVATED');
          if (report.deterministic?.cycle1?.matrix?.rescuedByTierABrowser < 1) throw new Error('TIER_A_BROWSER_RESCUE_NOT_PROVEN');
          if (report.deterministic?.cycle1?.matrix?.rescuedWithoutPcNode < 3) throw new Error('PC_MISS_RESCUE_NOT_PROVEN');
          if (report.deterministic?.sourceFailureCycle?.matrix?.unionFixtures !== 4) throw new Error('SOURCE_FAILURE_RETENTION_NOT_PROVEN');
          if (report.deterministic?.conflictCycle?.verificationStatus !== 'CONFLICT_FAIL_CLOSED') throw new Error('CONFLICT_FAIL_CLOSED_NOT_PROVEN');
          console.log(JSON.stringify({status:'PASS', safety:report.safety, deterministic:report.deterministic, livePublic:report.livePublic}));
          NODE

      - name: Upload Auto E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfi-daily-fixture-auto-e2e-${{ github.run_id }}
          path: |
            audit-reports/cfi-daily-fixture-auto-e2e.json
            audit-reports/cfi-daily-fixture-auto-e2e.md
            local-node/cache/registry/source-scan-plan.json
          if-no-files-found: warn
