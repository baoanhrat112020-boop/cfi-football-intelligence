name: Tmp U21 Check

on:
  push:
    branches: [tmp/u21-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apifootball-youth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dry run
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/apifootball_youth.py --dry-run
