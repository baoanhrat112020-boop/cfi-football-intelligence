name: Test HT period (OddsPortal)

on:
  push:
    branches: [test/gha-oddsharvester]
    paths: ['.github/workflows/test-ht.yml']

permissions:
  contents: read

concurrency:
  group: test-ht
  cancel-in-progress: true

jobs:
  ht:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, headed]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install oddsharvester
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Start Cloudflare WARP proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
      - name: Probe and scrape HT
        shell: bash
        env:
          MODE_NAME: ${{ matrix.mode }}
        run: |
          set +e
          mkdir -p out
          D=$(date -u -d '+1 day' +%Y%m%d)
          PREFIX=""; MODE="--headless"
          if [ "$MODE_NAME" = "headed" ]; then PREFIX="xvfb-run -a"; MODE="--no-headless"; fi
          $PREFIX oddsharvester upcoming -s football -d "$D" --links-only $MODE --proxy-url socks5://127.0.0.1:40000 -f json -o out/links.json > out/links.log 2>&1
          python - <<'PY'
          import json
          rows = json.load(open("out/links.json"))
          links = [r["match_link"] for r in rows if isinstance(r, dict)]
          sel = links[:4] + links[len(links) // 2:len(links) // 2 + 4]
          open("out/l.txt", "w").write("\n".join(sel) + "\n")
          open("out/probe.txt", "w").write("\n".join(sel[:4]) + "\n")
          print("links", len(links), "selected", len(sel))
          PY
          $PREFIX oddsharvester upcoming -s football --match-links-file out/l.txt --period 1st_half -m over_under,asian_handicap --concurrency 1 --request-delay 3 $MODE --proxy-url socks5://127.0.0.1:40000 -f json -o out/ht.json > out/ht.log 2>&1
          echo "ht_exit=$?"
          python - <<'PY'
          import json
          t = open("out/ht.log", errors="replace").read()
          print("no_period_bar:", t.count("shows no period bar"), "| could_not_verify:", t.count("Could not verify period"))
          try:
              d = json.load(open("out/ht.json"))
          except Exception:
              d = []
          n = 0
          for r in d:
              for k, v in r.items():
                  if k.endswith("_market") and v:
                      n += 1
          print("records", len(d), "nonempty_markets", n)
          PY
          cat > out/probe.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              links = [l.strip() for l in open("out/probe.txt") if l.strip()]
              async with async_playwright() as p:
                  b = await p.chromium.launch(headless=True, proxy={"server": "socks5://127.0.0.1:40000"})
                  pg = await b.new_page()
                  for l in links:
                      url = l.split("#")[0] + "#over-under;3"
                      try:
                          await pg.goto(url, wait_until="domcontentloaded", timeout=45000)
                          await pg.wait_for_timeout(6000)
                      except Exception as e:
                          print("goto fail", url, str(e)[:100])
                          continue
                      txt = await pg.evaluate("document.body.innerText")
                      print("URL", url)
                      print("has 1st Half:", "1st Half" in txt, "| has Full Time:", "Full Time" in txt, "| has Over/Under:", "Over/Under" in txt)
                      print("snippet:", " | ".join(x for x in txt.split("\n") if x.strip())[:400])
                  await b.close()
          asyncio.run(main())
          PY
          python out/probe.py 2>&1 | cut -c1-500
          echo "=== ht.log tail ==="; tail -8 out/ht.log | cut -c1-240
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ht-test-${{ matrix.mode }}
          path: out/
          retention-days: 3
