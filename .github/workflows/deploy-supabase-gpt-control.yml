name: Deploy Supabase cfi-gpt-control

on:
  pull_request:
    paths:
      - 'supabase/functions/cfi-gpt-control/**'
      - '.github/workflows/deploy-supabase-gpt-control.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/cfi-gpt-control/**'
      - '.github/workflows/deploy-supabase-gpt-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - name: Guard fail-closed AUDIT_3D source contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const s=readFileSync('supabase/functions/cfi-gpt-control/index.ts','utf8');
          for (const token of ['AUDIT_3D','AUDIT_UNVERIFIED','failClosed:true','futureEvidenceCount','sameDateEvidenceCount','maxEvidenceDate']) {
            if (!s.includes(token)) throw new Error(`missing fail-closed token: ${token}`);
          }
          if (/antiLeakage\s*:\s*true/.test(s)) throw new Error('hard-coded antiLeakage:true is forbidden');
          NODE

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy source-controlled Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy cfi-gpt-control --project-ref kovmddkkzttquupdgmel --no-verify-jwt
