name: Backfill Future Fixtures
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days ahead (1-14)'
        default: '7'
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase curl_cffi requests
      - name: Crawl future days
        env:
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          python -c "
          print('IMPORT START')
          from scripts.livescore_daily import crawl_day
          print('IMPORT OK')
          print('CRAWL offset 0 START')
          crawl_day(0)
          print('CRAWL offset 0 DONE')
          "
