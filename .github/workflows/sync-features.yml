name: Sync Features

# Bảng cfi_fixture_features bị xóa 28/9 cleanup DB, không còn consumer.
# Đã xóa cron schedule (trước đây: '15 * * * *'). scripts/sync_features.py đã bị xóa,
# nên chạy tay workflow này sẽ thất bại cho tới khi có script/bảng thay thế.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install pandas numpy supabase

      - name: Run sync_features.py
        env:
          SB_SERVICE_ROLE_KEY: ${{ secrets.CFI_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_features.py
