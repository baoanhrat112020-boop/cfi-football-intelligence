name: CFI GPT Current-Day Production Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfi-gpt-current-day-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Execute NEW real current-day Discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          DISCOVERED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node - "$TARGET_DATE" "$DISCOVERED_AT" <<'NODE' > /tmp/request.json
          const [targetDate,discoveredAt]=process.argv.slice(2);
          const candidates=[
            {provider:'GPT_WEB_SEARCH',providerId:'gpt-alnaft-duhok-20260826',home:'Al-Naft',away:'Duhok',competition:'Iraq Premier League',country:'Iraq',kickoffIso:'2026-08-26T15:30:00Z',targetDate,status:'scheduled',sourceUrls:['https://bongda24h.vn/lich-thi-dau/bong-da-hom-nay-26-08-2026-286-458248-amp.html'],discoveredAt},
            {provider:'GPT_WEB_SEARCH',providerId:'gpt-kahrabaa-karma-20260826',home:'Al Kahrabaa',away:'Al-Karma',competition:'Iraq Premier League',country:'Iraq',kickoffIso:'2026-08-26T15:45:00Z',targetDate,status:'scheduled',sourceUrls:['https://bongda24h.vn/lich-thi-dau/bong-da-hom-nay-26-08-2026-286-458248-amp.html'],discoveredAt},
            {provider:'GPT_WEB_SEARCH',providerId:'gpt-tammeka-flora-20260826',home:'Tartu JK Maag Tammeka',away:'FC Flora Tallinn',competition:'Estonia Meistriliiga',country:'Estonia',kickoffIso:'2026-08-26T16:00:00Z',targetDate,status:'scheduled',sourceUrls:['https://kqbd.mobi/lich-thi-dau/2026/08/26'],discoveredAt},
            {provider:'GPT_WEB_SEARCH',providerId:'gpt-realpotosi-tomayapo-20260826',home:'Real Potosi',away:'Real Tomayapo',competition:'Bolivia Division Profesional',country:'Bolivia',kickoffIso:'2026-08-26T15:30:00Z',targetDate,status:'scheduled',sourceUrls:['https://www.365scores.com/football/team/real-potosi-1285/standings'],discoveredAt},
            {provider:'GPT_WEB_SEARCH',providerId:'gpt-stockholm-hammarby-20260826',home:'FC Stockholm Internazionale',away:'Hammarby IF',competition:'Sweden Cup',country:'Sweden',kickoffIso:'2026-08-26T16:30:00Z',targetDate,status:'scheduled',sourceUrls:['https://bongda24h.vn/lich-thi-dau/bong-da-hom-nay-26-08-2026-286-458248-amp.html'],discoveredAt},
            {provider:'GPT_WEB_SEARCH',providerId:'gpt-friska-sirius-20260826',home:'Friska Viljor',away:'Sirius',competition:'Sweden Cup',country:'Sweden',kickoffIso:'2026-08-26T16:30:00Z',targetDate,status:'scheduled',sourceUrls:['https://bongda24h.vn/lich-thi-dau/bong-da-hom-nay-26-08-2026-286-458248-amp.html'],discoveredAt},
            {provider:'GPT_WEB_SEARCH',providerId:'gpt-dalstorp-norrby-20260826',home:'Dalstorps IF',away:'Norrby',competition:'Sweden Cup',country:'Sweden',kickoffIso:'2026-08-26T16:30:00Z',targetDate,status:'scheduled',sourceUrls:['https://bongda24h.vn/lich-thi-dau/bong-da-hom-nay-26-08-2026-286-458248-amp.html'],discoveredAt},
            {provider:'GPT_WEB_SEARCH',providerId:'gpt-rapid-hearts-20260826',home:'Rapid Wien',away:'Hearts',competition:'UEFA Conference League',country:'Europe',kickoffIso:'2026-08-26T16:45:00Z',targetDate,status:'scheduled',sourceUrls:['https://vietnamnet.vn/lich-thi-dau-bong-da-hom-nay-26-8-chung-ket-luot-ve-viet-nam-vs-thai-lan-2548974.html'],discoveredAt}
          ];
          process.stdout.write(JSON.stringify({target_date:targetDate,timezone:'Asia/Ho_Chi_Minh',max_matches:5,scan_limit:100,internal_provider_diagnostics:true,fixture_candidates:candidates}));
          NODE
          curl -fsS --max-time 300 -H 'content-type: application/json' --data-binary @/tmp/request.json "$BASE/api/discover" -o /tmp/acceptance.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/acceptance.json','utf8'));
          const c=x?.counts||{};
          const concise={status:x.status,action:x.action,version:x.version,targetDate:x.targetDate,provider:x.provider,counts:c,search:x.search,providerAttempts:x.providerAttempts,diagnostics:(x.diagnostics||[]).map(d=>({match:d.match,predictionStatus:d.predictionStatus,predictionError:d.predictionError,strictPrior:d.strictPrior,failureLayer:d.failureLayer,reasonCode:d.reasonCode,exactTeam:d.exactTeam,canonicalIdentity:d.canonicalIdentity,temporalEvidenceAudit:d.temporalEvidenceAudit})),board:(x.board||[]).map(r=>({match:r.match,kickoff:r.kickoff,status:r.status,strictPrior:r.strictPrior,consistency:r.consistency,multiMarketStatus:r.multiMarketStatus,multiMarketDecisionUse:r.multiMarketDecisionUse,contract:r.prediction?.sixTargetMatrix?.contract,sixTargetComplete:r.prediction?.sixTargetMatrix?.verification?.complete,snapshotId:r.prediction?.audit?.body?.snapshotId||null})),final:x.final};
          console.log(JSON.stringify(concise,null,2));
          const fail=m=>{throw new Error(m)};
          if(!(Number(c.fixturesDiscovered)>0))fail('fixturesDiscovered <= 0');
          if(!(Number(c.canonicalized)>0))fail('canonicalized <= 0');
          if(!(Number(c.predictionAttempts)>0))fail('predictionAttempts <= 0');
          if(!(Number(c.predictionSuccess)>0))fail('predictionSuccess <= 0');
          if(!Array.isArray(x.board)||x.board.length<1)fail('Daily Board missing');
          for(const r of x.board){if(r.strictPrior!==true)fail('strict-prior not verified');if(r.prediction?.sixTargetMatrix?.contract!=='CFI_2_METHODS_X_6_TARGETS_V1'||r.prediction?.sixTargetMatrix?.verification?.complete!==true)fail('Champion 6 incomplete');if(r.multiMarketDecisionUse!==false)fail('shadow Multi-Market promoted');}
          console.log('CFI_GPT_CURRENT_DAY_PRODUCTION_ACCEPTANCE=PASS');
          NODE
