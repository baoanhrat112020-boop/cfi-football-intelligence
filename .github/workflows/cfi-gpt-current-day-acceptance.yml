name: CFI GPT Current-Day Production Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfi-gpt-current-day-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Execute NEW real current-day Discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE='2026-08-26'
          DISCOVERED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          accepted=0

          # Each row is the same-day verified fixture identity/name variant only.
          # The loop stops immediately on the first real production prediction success.
          candidates=(
            'Tammeka|Flora Tallinn|2026-08-26T16:00:00Z|Estonian Premium liiga|Estonia|gpt-tammeka-flora|https://www.fotmob.com/en-GB/matches/tammeka-vs-flora-tallinn/19262s'
            'Tammeka Tartu|Flora Tallinn|2026-08-26T16:00:00Z|Estonian Premium liiga|Estonia|gpt-tammeka-flora-2|https://www.footlive.com/score/jk-tammeka-tartu-vs-fc-flora-tallinn-2026-08-26/'
            'JK Tammeka|FC Flora Tallinn|2026-08-26T16:00:00Z|Estonian Premium liiga|Estonia|gpt-tammeka-flora-3|https://www.fotmob.com/en-GB/matches/tammeka-vs-flora-tallinn/19262s'
            'Strommen|Raufoss|2026-08-26T16:00:00Z|Norway 1. Division|Norway|gpt-strommen-raufoss|https://www.fotmob.com/matches/strommen-vs-raufoss/1mv6nz'
            'Strømmen|Raufoss|2026-08-26T16:00:00Z|OBOS-ligaen|Norway|gpt-strommen-raufoss-2|https://www.strommen-if.no/terminliste'
            'Strømmen IF|Raufoss|2026-08-26T16:00:00Z|OBOS-ligaen|Norway|gpt-strommen-raufoss-3|https://www.fotball.no/fotballdata/lag/hjem/?fiksId=184&underside=kamper'
            'Al Faisaly|Al Fateh|2026-08-26T16:00:00Z|Roshn Saudi League|Saudi Arabia|gpt-al-faisaly-al-fateh|https://www.saff.com.sa/en/team.php?id=39'
          )

          for item in "${candidates[@]}"; do
            IFS='|' read -r HOME AWAY KICKOFF COMP COUNTRY PROVIDER_ID SOURCE <<< "$item"
            NOW=$(date -u +%s); KO=$(date -u -d "$KICKOFF" +%s)
            if [ "$NOW" -ge "$KO" ]; then
              echo "Skipping post-kickoff candidate: $HOME vs $AWAY"
              continue
            fi
            echo "Trying verified candidate: $HOME vs $AWAY @ $KICKOFF"
            node - "$HOME" "$AWAY" "$KICKOFF" "$COMP" "$COUNTRY" "$PROVIDER_ID" "$SOURCE" "$DISCOVERED_AT" <<'NODE' > /tmp/request.json
          const [home,away,kickoffIso,competition,country,providerId,source,discoveredAt]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            target_date:'2026-08-26',timezone:'Asia/Ho_Chi_Minh',max_matches:1,scan_limit:40,
            fixture_candidates:[{provider:'GPT_WEB_SEARCH',providerId,home,away,competition,country,kickoffIso,targetDate:'2026-08-26',status:'scheduled',sourceUrls:[source],discoveredAt}]
          }));
          NODE
            curl -fsS --max-time 180 -H 'content-type: application/json' --data-binary @/tmp/request.json "$BASE/api/discover" -o /tmp/acceptance.json
            set +e
            node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/acceptance.json','utf8'));const c=x?.counts||{};
          const concise={status:x.status,action:x.action,version:x.version,targetDate:x.targetDate,provider:x.provider,counts:c,search:x.search,diagnostics:(x.diagnostics||[]).map(d=>({match:d.match,predictionHttpStatus:d.predictionHttpStatus,predictionStatus:d.predictionStatus,predictionError:d.predictionError,strictPrior:d.strictPrior,failureLayer:d.failureLayer,reasonCode:d.reasonCode,canonicalIdentity:d.canonicalIdentity,exactTeam:d.exactTeam,temporalEvidenceAudit:d.temporalEvidenceAudit})),board:(x.board||[]).map(r=>({match:r.match,kickoff:r.kickoff,status:r.status,strictPrior:r.strictPrior,consistency:r.consistency,multiMarketStatus:r.multiMarketStatus,multiMarketDecisionUse:r.multiMarketDecisionUse,sixTargetComplete:r.prediction?.sixTargetMatrix?.verification?.complete,sixTargetContract:r.prediction?.sixTargetMatrix?.contract,snapshotId:r.prediction?.audit?.body?.snapshotId||null})),final:x.final};
          console.log(JSON.stringify(concise,null,2));fs.writeFileSync('/tmp/concise.json',JSON.stringify(concise,null,2));process.exit(Number(c.predictionSuccess||0)>0?0:3);
          NODE
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then accepted=1; break; fi
          done

          if [ "$accepted" != 1 ]; then
            echo '::error title=Production acceptance failed::All verified future same-day candidate variants were exhausted without predictionSuccess > 0.'
            cat /tmp/concise.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/acceptance.json','utf8'));const c=x?.counts||{};const fail=m=>{throw new Error(m)};
          if(!(Number(c.fixturesDiscovered)>0))fail('fixturesDiscovered <= 0');
          if(!(Number(c.canonicalized)>0))fail('canonicalized <= 0');
          if(!(Number(c.predictionAttempts)>0))fail('predictionAttempts <= 0');
          if(!(Number(c.predictionSuccess)>0))fail('predictionSuccess <= 0');
          if(!Array.isArray(x.board)||x.board.length<1)fail('Daily Board missing');
          for(const r of x.board){if(r.strictPrior!==true)fail('strict-prior not verified');if(r.prediction?.sixTargetMatrix?.contract!=='CFI_2_METHODS_X_6_TARGETS_V1'||r.prediction?.sixTargetMatrix?.verification?.complete!==true)fail('Champion 6 incomplete');if(r.multiMarketDecisionUse!==false)fail('shadow Multi-Market promoted');}
          console.log(JSON.stringify({acceptance:'PASS',counts:c,board:x.board.map(r=>({match:r.match,status:r.status,strictPrior:r.strictPrior,multiMarketStatus:r.multiMarketStatus,multiMarketDecisionUse:r.multiMarketDecisionUse,contract:r.prediction?.sixTargetMatrix?.contract,sixTargetComplete:r.prediction?.sixTargetMatrix?.verification?.complete,snapshotId:r.prediction?.audit?.body?.snapshotId||null}))},null,2));
          console.log('CFI_GPT_CURRENT_DAY_PRODUCTION_ACCEPTANCE=PASS');
          NODE
