name: CFI GPT Current-Day Production Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfi-gpt-current-day-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Execute NEW real current-day Discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cfi-football-intelligence.baoanhrat112020.workers.dev'
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          cat > /tmp/request.json <<JSON
          {"target_date":"$TARGET_DATE","timezone":"Asia/Ho_Chi_Minh","max_matches":5,"scan_limit":100,"internal_provider_diagnostics":true}
          JSON
          curl -fsS --max-time 300 -H 'content-type: application/json' --data-binary @/tmp/request.json "$BASE/api/discover" -o /tmp/acceptance.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/acceptance.json','utf8'));
          const c=x?.counts||{};
          const concise={
            status:x.status,action:x.action,version:x.version,targetDate:x.targetDate,provider:x.provider,
            counts:c,search:x.search,providerAttempts:x.providerAttempts,
            diagnostics:(x.diagnostics||[]).map(d=>({match:d.match,predictionStatus:d.predictionStatus,predictionError:d.predictionError,strictPrior:d.strictPrior,failureLayer:d.failureLayer,reasonCode:d.reasonCode,exactTeam:d.exactTeam,canonicalIdentity:d.canonicalIdentity,temporalEvidenceAudit:d.temporalEvidenceAudit})),
            board:(x.board||[]).map(r=>({match:r.match,kickoff:r.kickoff,status:r.status,strictPrior:r.strictPrior,consistency:r.consistency,multiMarketStatus:r.multiMarketStatus,multiMarketDecisionUse:r.multiMarketDecisionUse,contract:r.prediction?.sixTargetMatrix?.contract,sixTargetComplete:r.prediction?.sixTargetMatrix?.verification?.complete,snapshotId:r.prediction?.audit?.body?.snapshotId||null})),
            final:x.final
          };
          console.log(JSON.stringify(concise,null,2));
          const fail=m=>{throw new Error(m)};
          if(!(Number(c.fixturesDiscovered)>0))fail('fixturesDiscovered <= 0');
          if(!(Number(c.canonicalized)>0))fail('canonicalized <= 0');
          if(!(Number(c.predictionAttempts)>0))fail('predictionAttempts <= 0');
          if(!(Number(c.predictionSuccess)>0))fail('predictionSuccess <= 0');
          if(!Array.isArray(x.board)||x.board.length<1)fail('Daily Board missing');
          for(const r of x.board){
            if(r.strictPrior!==true)fail('strict-prior not verified');
            if(r.prediction?.sixTargetMatrix?.contract!=='CFI_2_METHODS_X_6_TARGETS_V1'||r.prediction?.sixTargetMatrix?.verification?.complete!==true)fail('Champion 6 incomplete');
            if(r.multiMarketDecisionUse!==false)fail('shadow Multi-Market promoted');
          }
          console.log('CFI_GPT_CURRENT_DAY_PRODUCTION_ACCEPTANCE=PASS');
          NODE
