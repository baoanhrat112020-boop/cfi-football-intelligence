name: Test OddsPortal IP (GHA)

on:
  push:
    branches: [test/gha-oddsharvester]
    paths: ['.github/workflows/test-oddsportal-ip.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ip-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner egress IP
        run: |
          curl -sS -m 10 https://api.ipify.org || echo "ipify failed"
          echo

      - name: Check OddsPortal reachability and challenge
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          for url in https://www.oddsportal.com/ https://www.oddsportal.com/football/spain/laliga2/; do
            echo "=== $url (browser UA) ==="
            curl -sS -m 25 -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' -o body.html -D headers.txt \
              -w "http=%{http_code} size=%{size_download} time=%{time_total}s\n" "$url"
            echo "curl rc=$?"
            head -15 headers.txt
            echo "title: $(grep -ioE '<title>[^<]*' body.html | head -1)"
            echo "challenge markers:"
            grep -ioE 'just a moment|cf-challenge|cf_chl|attention required|access denied|captcha|enable javascript' body.html | sort -u || true
            echo "---"
          done
          echo "=== homepage (default curl UA) ==="
          curl -sS -m 25 -o /dev/null -w "http=%{http_code}\n" https://www.oddsportal.com/
