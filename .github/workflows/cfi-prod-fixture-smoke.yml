name: CFI BongdaWap Preview Smoke

on:
  push:
    branches:
      - test/fixtures-prod-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST preview fixtures-day after parser fix
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fix-bongdawap-fixture-source-cfi-football-intelligence.baoanhrat112020.workers.dev/api/fixtures-day'
          START=$(date +%s)
          HTTP=$(curl -sS --max-time 10 -o /tmp/fixtures.json -w '%{http_code}'             -X POST "$URL"             -H 'content-type: application/json'             --data '{"target_date":"2026-09-15","timezone":"Asia/Ho_Chi_Minh"}')
          END=$(date +%s)
          echo "http=$HTTP elapsed=$((END-START))s"
          test "$HTTP" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/fixtures.json','utf8'));
          const sample=(body.rows||[]).slice(0,10).map(x=>({time:x.kickoffLocal,home:x.home,away:x.away,competition:x.competition,provider:x.provider}));
          console.log(JSON.stringify({
            status:body.status,
            source:body.source,
            providers:body.providers,
            fixtures:Array.isArray(body.rows)?body.rows.length:null,
            sample,
            bongdaWapAttempt:(body.attempts||[]).find(x=>x.provider==='BONGDAWAP')
          },null,2));
          if(body.status!=='OK') throw new Error('status='+body.status);
          if(!Array.isArray(body.rows)||body.rows.length<10) throw new Error('fixture coverage too low: '+(body.rows||[]).length);
          if(!(body.providers||[]).includes('BONGDAWAP')) throw new Error('BongdaWap not active');
          NODE

# overnight-rollover-smoke
