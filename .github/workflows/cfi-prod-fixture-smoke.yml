name: CFI BongdaWap HTML Probe

on:
  push:
    branches:
      - test/fixtures-prod-smoke

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect BongdaWap match markup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,html
          url="https://bongdawap.com/lich-thi-dau-bong-da-ngay-15-09-2026.html"
          r=requests.get(url,timeout=10,headers={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1"})
          print("STATUS",r.status_code,"LEN",len(r.text))
          text=r.text
          rows=re.findall(r'(?is)<tr\b[^>]*>.*?</tr>',text)
          print("TR_COUNT",len(rows))
          hits=[x for x in rows if re.search(r'(?i)>\s*vs\s*<',x)]
          print("VS_TR_COUNT",len(hits))
          for i,row in enumerate(hits[:8]):
              print("\nROW",i,html.unescape(re.sub(r'\s+',' ',row))[:2500])
          print("\nVS_TEXT_COUNT",len(re.findall(r'(?i)\bvs\b',text)))
          for m in list(re.finditer(r'(?i)\bvs\b',text))[:5]:
              s=max(0,m.start()-700);e=min(len(text),m.end()+900)
              print("\nCTX",html.unescape(re.sub(r'\s+',' ',text[s:e])))
          PY
