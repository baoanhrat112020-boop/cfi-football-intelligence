name: CFI Fixture Source Probe

on:
  push:
    branches:
      - test/fixtures-prod-smoke

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public fixture sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests
          urls=[
            "https://www.aiscore.com/today-matches",
            "https://vnm.aiscore.com/",
            "https://bongdawap.com/lich-thi-dau-bong-da-ngay-15-09-2026.html",
            "https://www.soccerway.com/matches/2026/09/15/",
            "https://www.flashscore.com/"
          ]
          for url in urls:
              try:
                  r=requests.get(url,timeout=8,headers={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1"})
                  print("\nURL",url,"STATUS",r.status_code,"LEN",len(r.content),"CT",r.headers.get("content-type"))
                  print(r.text[:1000].replace("\n"," ") if r.text else "")
              except Exception as e:
                  print("\nURL",url,"ERR",repr(e))
          PY
