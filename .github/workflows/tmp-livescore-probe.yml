name: tmp livescore probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi
      - name: Probe Eid 1899863
        run: |
          python - <<'PY'
          import json
          from curl_cffi import requests as cf
          r = cf.get("https://prod-cdn-mev-api.livescore.com/v1/api/app/date/soccer/20261006/0?MD=1", impersonate="chrome120", timeout=20)
          out = {"http_status": r.status_code}
          try:
              d = json.loads(r.text)
          except Exception as e:
              out["parse_error"] = str(e)[:100]
              print("::notice title=probe::" + json.dumps(out))
              raise SystemExit(0)
          stages = d.get("Stages", [])
          events = [(st, ev) for st in stages for ev in st.get("Events", [])]
          out["stages"] = len(stages)
          out["events"] = len(events)
          hits = []
          for st, ev in events:
              names = " ".join(t.get("Nm", "") for t in (ev.get("T1") or []) + (ev.get("T2") or []))
              if str(ev.get("Eid")) == "1899863" or "Romania U19" in names:
                  hits.append({"league": st.get("Snm") or st.get("Cnm"), **{k: ev.get(k) for k in ("Eid", "Esd", "Epr", "Eps", "Tr1", "Tr2", "Trh1", "Trh2")}, "teams": names})
          out["hits"] = hits
          print("::notice title=probe::" + json.dumps(out))
          PY
